openapi: 3.0.3
info:
  title: 青岛地铁 ITP 自助补站接口
  description: |
    IF8A-04 请求自助补站。

    业务流程：
    1. APP 发起补进站/补出站请求。
    2. ticket-server 校验参数与前置条件（codeStatus 限制补站类型）。
    3. 更新 QRCodeStatus 票卡状态。
    4. 调用 para-server 计算进站/出站间票价。
    5. 返回结果给 APP。

    Phase 1（已实现）：状态修正 + 票价查询。
    Phase 2（待实现）：BOM/ACC 同步、费用扣减（gate-txn-pay-server）、超时判断、日票逻辑。
  version: 1.0.1
servers:
  - url: http://localhost:8080
    description: 本地开发环境
paths:
  /ci/app/requestExcessFare:
    post:
      tags:
        - APP
      summary: IF8A-04 请求自助补站
      description: |
        APP 发起自助补进站/补出站请求。
        请求报文采用 application/x-www-form-urlencoded 格式，业务参数放在 bizData 字段中（JSON 字符串）。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - providerId
                - charset
                - format
                - timestamp
                - deviceId
                - signType
                - sign
                - bizData
              properties:
                providerId:
                  type: string
                  description: 服务提供商编码
                  example: "01"
                charset:
                  type: string
                  description: 字符集
                  example: "UTF-8"
                format:
                  type: string
                  description: 报文格式
                  example: "json"
                timestamp:
                  type: string
                  description: 请求时间戳 yyyyMMddHHmmss
                  example: "20260626120000"
                deviceId:
                  type: string
                  description: 设备编码
                  example: "APP"
                signType:
                  type: string
                  description: 签名类型 00 表示无签名
                  example: "00"
                sign:
                  type: string
                  description: 签名字段
                  example: ""
                bizData:
                  type: string
                  description: 业务参数 JSON 字符串
                  example: '{"thirdUserId":"1001","cardId":"9900000000000001","cardType":"0441","upgradeAreaType":"01","upgradeStationCode":"0101","upgradeDateTime":"20260626120000"}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestExcessFareResult'
              examples:
                entrySuccess:
                  summary: 补进站成功
                  value:
                    retCode: "0000"
                    retMsg: "成功"
                exitSuccess:
                  summary: 补出站成功
                  value:
                    retCode: "0000"
                    retMsg: "成功"
                completedOnlyEntry:
                  summary: 已完成交易，只能补进站
                  value:
                    retCode: "8001"
                    retMsg: "当前已完成交易，只能补进站"
                inEntryOnlyExit:
                  summary: 已进站，只能补出站
                  value:
                    retCode: "8001"
                    retMsg: "当前已进站，只能补出站"
                exitWithoutEntry:
                  summary: 补出站但无进站记录
                  value:
                    retCode: "8304"
                    retMsg: "没有进站记录，无法补出站"
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestExcessFareResult'
              examples:
                invalidParam:
                  summary: 必填参数缺失
                  value:
                    retCode: "8001"
                    retMsg: "cardId/upgradeAreaType/upgradeStationCode不能为空"
        '500':
          description: 系统内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestExcessFareResult'
              examples:
                systemError:
                  summary: 系统异常
                  value:
                    retCode: "9001"
                    retMsg: "系统内部错误"
components:
  schemas:
    RequestExcessFareReqDTO:
      type: object
      description: IF8A-04 请求自助补站业务参数
      required:
        - thirdUserId
        - cardId
        - cardType
        - upgradeAreaType
        - upgradeStationCode
      properties:
        thirdUserId:
          type: string
          description: 第三方用户id
          example: "1001"
        cardId:
          type: string
          description: 地铁会员卡号
          example: "9900000000000001"
        cardType:
          type: string
          description: 卡类型编码
          example: "0441"
        upgradeAreaType:
          type: string
          description: 更新区域类型 01：补进站 02：补出站
          example: "01"
        upgradeStationCode:
          type: string
          description: 补进/出站编码
          example: "0101"
        upgradeReason:
          type: string
          description: 更新原因预留
          example: ""
        upgradeDateTime:
          type: string
          description: 更新操作时间 YYYYMMDDHHmmss
          example: "20260626120000"
    RequestExcessFareResult:
      type: object
      description: IF8A-04 应答
      properties:
        retCode:
          type: string
          description: 返回码
          example: "0000"
        retMsg:
          type: string
          description: 返回消息
          example: "成功"
