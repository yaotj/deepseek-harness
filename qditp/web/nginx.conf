        # collect-pay-server（30024）：2026-10-13 已下线（0 pod），旧单页面当前不可用；本段保留作历史记录。
        # 本段 NEVER 再指向 30025 —— face-pay 上没有 TBL_TVM_ORDER_PAY 那些旧表单。
        location /collect-pay-server {
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-real-ip $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header origin "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_pass      http://172.20.211.23:30024/;
            rewrite ^/collect-pay-server/(.*) /$1 break;
        }
        # face-pay-server（30025，face-pay-server-svc）：TVM/BOM/APP 当面付现行主模块（F2F_* 表），ADR-D116/D117。
        # 运营页 /page/face-pay/orders 与其退款端点都走这里；本段与前端 web/src/api/trans/facePayOrder.js 成对，改一处 MUST 改另一处。
        location /face-pay-server {
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-real-ip $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header origin "";
            proxy_connect_timeout 10s;
