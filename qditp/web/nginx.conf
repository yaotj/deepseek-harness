        # alipay-pay-sign-server（30022，alipay-pay-sign-server-svc）：支付宝签约 / 退款域。
        # 运营只读页 /page/alipay/**（签约用户 / 渠道退款记录）走这里；本段与前端
        # web/src/api/trans/alipayChannel.js 成对，改一处 MUST 改另一处。
        # 支付统计不落本模块（扣费权威在 gate-txn-pay，走 /gate-txn-pay-server）。
        # NodePort 30022 按 web/vite.config.js 快照；上线前 MUST 现查 k8s svc 复核。
        location /alipay-pay-sign-server {
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-real-ip $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header origin "";
