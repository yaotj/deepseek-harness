        # recon-server（recon-server-bjzdy-svc，容器 8080 / NodePort 30034）：对账报表域。
        # 本段与前端 web/src/api/report/txnDiff.js 等的 /recon-server/page/recon/** 成对，改一处 MUST 改另一处。
        # NodePort 30034 按 2026-11-06 k8s svc 现查（recon-server-bjzdy-svc: 30034:30034/TCP）；上线前 MUST 现查 k8s svc 复核。
        # ⚠️ 本段为 2026-11-06 补录：11-04 静态确凿发现本前缀缺失，但当日测试环境不可达未复现；
        #    11-06 复现确认：缺前缀时 GET /recon-server/page/recon/* 落进 location / 静态 catch-all 返 200 HTML（非 404），
        #    导致报表面板静默空白。详见 docs/tracking/问题清单.md IT-062 索引行。
        location /recon-server {
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-real-ip $remote_addr;
