            rewrite ^/card-pool-server/(.*) /$1 break;
        }

        # key-server（key-server-vcbmt-svc，容器 8080 / NodePort 30015）：密钥版本汇总只读页。
        # 本段与前端 web/src/api/trans/keyVersion.js 的 /key-server/page/key/versions 成对，改一处 MUST 改另一处。
