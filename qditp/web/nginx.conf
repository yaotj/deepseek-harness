        # face-pay-server（30025，face-pay-server-svc）：TVM/BOM/APP 当面付现行主模块（F2F_* 表），ADR-D85。
        # 运营页 /page/face-pay/orders 与其退款端点都走这里；本段与前端 web/src/api/trans/facePayOrder.js 成对，改一处 MUST 改另一处。
