        # ========== K8s 健康检查 ==========
        location /health {
            access_log off;
            return 200 "healthy";
            add_header Content-Type text/plain;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
