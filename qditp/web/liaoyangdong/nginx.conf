# ==========================================
# Web 管理前端 - 辽阳东生产环境适配版
#   CloudOS: https://172.110.209.151 / namespace: itpa / 应用: web-frontend
#   2026-11-13 由 web/nginx.conf（测试环境最新完整版）改写
# ==========================================
#
# 【辽阳东适配要点】
# 1. 所有 proxy_pass 改为辽阳东 K8s 的 ClusterIP Service DNS（端口统一 8080）。
#    Service 名/端口来自实查 GET /api/cloud/app-mgmt/v1.0/apps/{uuid}/service，
#    ⚠️ 名字带平台随机后缀（如 -r1za8-svc），应用重建后 MUST 重新实查并同步本文件。
# 2. 辽阳东 23 个应用里绝大多数只建了 ClusterIP、没有 NodePort，
#    因此不能沿用红岛/测试的「节点 IP + 300xx / 319xx NodePort」形式。
#    前端 nginx Pod 与后端服务同在 namespace itpa，故用 `<svc>.itpa.svc` 短名解析。
# 3. ⚠️ nginx 启动时会解析 upstream/proxy_pass 里的主机名，解析不到会直接
#    `host not found in upstream` 启动失败：本文件只写辽阳东确实存在的 Service。
#    辽阳东未部署 collect-pay-server / es-server(acc-es-server)，
#    fep-acc-server / fep-alipay-server 虽已建应用但无 Service —— 这四类均不配置反代段。
# 4. 本文件是「配置升级」用的 nginx.conf（平台 setting_file_id），
#    与「应用包升级」是两条独立通道：NEVER 用 web release 应用包升级代替配置升级。
# 5. E7501 / CloudOS web 包适配：注释 user / pid / error_log / access_log 文件路径，
#    避免容器权限或目录不存在导致 CrashLoopBackOff。
#
# ==========================================
# ⚠️ E7501 适配：注释掉 user 和 pid，避免容器权限问题导致 Pod CrashLoopBackOff
# user  nginx;
# pid   /var/run/nginx.pid;

worker_processes auto;
# ⚠️ E7501 适配：注释掉 error_log 文件路径，避免目录不存在报错
# error_log /var/log/nginx/error.log warn;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;

    # MIME 类型映射（E7501 资源包模式替代 /etc/nginx/mime.types）
    types {
        text/html                             html;
        text/css                              css;
        text/xml                              xml;
        text/plain                            txt;
        application/json                      json;
        application/javascript                js;
        application/xml+rss                   rss;
        application/atom+xml                  atom;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpeg jpg;
        image/gif                             gif;
        image/webp                            webp;
        font/woff                             woff;
        font/woff2                            woff2;
        application/vnd.ms-fontobject         eot;
        font/ttf                              ttf;
    }

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent $request_time '
                    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

    # ⚠️ E7501 适配：注释掉 access_log 文件路径
    # access_log /var/log/nginx/access.log main;

    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server_tokens off;

    # 综管台 web-admin（/prod-api/ 与 /web-server 都落这里）
    upstream web_backend {
        server web-admin-7fei9-svc.itpa.svc:8080;
    }

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ========== 上传支持 ==========
        # server 级统一放行，覆盖下面所有 location（含 /web-server）。
        # 对账文件 /web-server/recon/upload-file/upload 与头像
        # /web-server/system/user/profile/avatar 都是 multipart，默认 1m 会 413。
        client_max_body_size 100M;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ==========================================
        # 前端静态资源缓存 / History 路由
        # ==========================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
        }

        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ==========================================
        # 后端 API 反向代理（辽阳东 itpa / 8080）
        # 每段均去掉 /{服务名} 前缀后转发，与 vite.config.js 的 rewrite 口径一致。
        # ==========================================
        location /prod-api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://web_backend/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 综管台：登录、系统管理、对账文件上传（前端调用量最大的一段）
        location /web-server {
            proxy_buffering off;
            proxy_request_buffering off;   # 流式转发，容器未必有可写 client_body_temp
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-real-ip $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header origin "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;       # 大文件上传 + 后端解析放宽到 300s
            proxy_send_timeout 300s;
            proxy_pass      http://web-admin-7fei9-svc.itpa.svc:8080/;
            rewrite ^/web-server/(.*) /$1 break;
        }

        location /para-server {
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-real-ip $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header origin "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_pass      http://para-server-r1za8-svc.itpa.svc:8080/;
            rewrite ^/para-server/(.*) /$1 break;
