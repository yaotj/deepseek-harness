server.port=${CARD_POOL_PORT:9111}
spring.application.name=card-pool

other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true

# traceId 关联：micro/web 默认 management.tracing.enabled=false，此处为 card-pool 打开。
# 打开后 web-admin 卡池维护定时任务发来的 W3C traceparent 才能被续接进 MDC，
# 日志 pattern 的 %X{traceId} 才有值，否则前台按 sys_job_log 的 traceId 检索本模块日志会 0 条。
# 只需要 MDC 里的 traceId/spanId 供 VictoriaLogs 日志检索，span 上报一律不要。
management.tracing.enabled=true
management.tracing.sampling.probability=0
# NEVER 删除下面这行排除（口径同 pay-sign-server/application.properties）：
# 1) sampling.probability=0 只让本服务发起的 trace 不采样，采样器是 parentBased(traceIdRatioBased(0))，
#    上游带 sampled=1 的 traceparent / b3 头进来时 span 仍会被采样并进导出队列；
# 2) micro/web 的 web.properties 已把 management.otlp.tracing.endpoint 整行注释掉，本行是第二道保险——
#    K8s Deployment 只要注入 MANAGEMENT_OTLP_TRACING_ENDPOINT env 就会重新激活 exporter；
# 3) Boot 3.2.6 没有 management.tracing.export.enabled 这个开关，把 endpoint 置空也不行
#    （OtlpAutoConfiguration 只判断键是否存在），只能排掉整个自动配置。
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration

other.sql.host=${DB_HOST:}
other.sql.double-datasource=false
other.sql.type=oracle
other.sql.page.type=oracle
other.sql.database=${DB_NAME:}
other.sql.username=${DB_USERNAME:}
other.sql.password=${DB_PASSWORD:}
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.configuration.jdbc-type-for-null=NULL
acc.secure.base-url=${ACC_BASE_URL:}
acc.secure.request-qr-logic-num-list-path=${ACC_QR_LOGIC_NUM_PATH:/ci/itp/requestQrLoigcNumList}
acc.secure.provider-id=${ACC_PROVIDER_ID:06}
acc.secure.device-id=${ACC_DEVICE_ID:ITP-CARD-POOL}
acc.secure.sign-type=${ACC_SIGN_TYPE:00}
acc.secure.sign-key=${ACC_SIGN_KEY:}
acc.secure.connect-timeout-millis=${ACC_CONNECT_TIMEOUT_MILLIS:10000}
acc.secure.read-timeout-millis=${ACC_READ_TIMEOUT_MILLIS:30000}
card-pool.threshold=${CARD_POOL_THRESHOLD:10000}
card-pool.request-num=${CARD_POOL_REQUEST_NUM:100000}
card-pool.sequence-alert-threshold=${CARD_POOL_SEQUENCE_ALERT_THRESHOLD:999900}
card-pool.reservation-minutes=${CARD_POOL_RESERVATION_MINUTES:10}
card-pool.lock-stale-seconds=${CARD_POOL_LOCK_STALE_SECONDS:1800}
card-pool.import-chunk-size=${CARD_POOL_IMPORT_CHUNK_SIZE:1000}
card-pool.ftp.host=${CARD_POOL_FTP_HOST:}
card-pool.ftp.port=${CARD_POOL_FTP_PORT:21}
card-pool.ftp.username=${CARD_POOL_FTP_USERNAME:}
card-pool.ftp.password=${CARD_POOL_FTP_PASSWORD:}
card-pool.ftp.base-dir=${CARD_POOL_FTP_BASE_DIR:/}
card-pool.ftp.max-file-size=${CARD_POOL_FTP_MAX_FILE_SIZE:52428800}
card-pool.ftp.connect-timeout-millis=${CARD_POOL_FTP_CONNECT_TIMEOUT_MILLIS:10000}
card-pool.ftp.so-timeout-millis=${CARD_POOL_FTP_SO_TIMEOUT_MILLIS:30000}
