  algorithm: SHA256WithRSA
server:
  port: 58101
  tomcat:
    basedir: ./logs

bom:
  payTimeOut: 180
  payTimeInterval: 3
## TVM 取票授权的挂起等待（2026-09-11 新增）。
tvm:
  takeTicket:
    waitMillis: 10000
    pollIntervalMillis: 500
    maxWaiting: 500
spring:
  application:
    name: itpagm
  ## NEVER 删除下面这行排除（口径同 pay-sign-server / card-pool-server 的 application.properties）：
  autoconfigure:
    exclude: org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
## traceId 关联：micro/web 默认 management.tracing.enabled=false，此处为 collect-pay 打开。
management:
  tracing:
    enabled: true
    sampling:
      probability: 0
service:
  ticket:
    url: http://127.0.0.1:9103
    openLogger: true
  account:
    url: http://127.0.0.1:9098
    openLogger: true
  ## recon-server 已于 2026-09-11 部署，下面是 `kubectl get svc -n itp` 实测的真实 Service 名。
  ## 注意 Service 端口等于 NodePort 号（30034），不等于容器 server.port（9112）。
  recon:
    url: ${SERVICE_RECON_URL:http://recon-server-bjzdy-svc.itp.svc:30034}
recon:
  ## 内部接口共享令牌，默认必须为空、由 K8s Secret 注入 RECON_INTERNAL_TOKEN
  internal-token: ${RECON_INTERNAL_TOKEN:}
  export:
    temp-dir: ${RECON_EXPORT_TEMP_DIR:/home/javaapp/app/recon-export}
    page-size: ${RECON_EXPORT_PAGE_SIZE:5000}
    worker: ${RECON_EXPORT_WORKER:1}
## 日志走本模块自带配置 log4j2-collectpay.xml，公共 log4j2-linux.xml 不再参与
logging:
  config: classpath:log4j2-collectpay.xml
