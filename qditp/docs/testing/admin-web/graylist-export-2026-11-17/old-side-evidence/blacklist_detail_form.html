<script>
//
optHist();


$("#stop_status").click(function(e){
    pass("1");
});
$("#remove_status").click(function(e){
    pass("2");
});
function pass(sta){
	$.post("/qd-omp/a/risk/riskBlackList/updateStatus",{"id":$("#id").val(),rStatus:sta,"userId":$("#userId").val()},function(data){
		if(data=="0"){
			alert("更新成功!");
			location.href="/qd-omp/a/risk/riskBlackList/form?idNo="+$("#idNo").val();		
		}else if(data == "1"){
			alert("加入黑名单失败!");
		}else if(data == "2"){
			alert("移除黑名单失败!");
		}else if(data == "3"){
			alert("该用户已到拉黑上限,永久禁用此产品!");
		}else if(data == "99"){
			alert("该用户已存在!");
		}
	});
}

// 初始化DataGrid对象
$('#dataGrid').dataGrid({
	searchForm: $("#searchForm"),
	columnModel: [
		{header:'管理编码', name:'managerId', index:'a.manager_id', width:150, align:"center"},
		{header:'审批状态', name:'status', index:'a.status', width:150, align:"center", formatter: function(val, obj, row, act){
			return js.getDictLabel([{"dictValue":"0","dictLabel":"待审批"},{"dictValue":"1","dictLabel":"已审批"},{"dictValue":"2","dictLabel":"已停用"}], val, '未知', true);
		}},
		{header:'备注', name:'hanleDesc', index:'a.hanle_desc', width:150, align:"center"},
		{header:'更新时间', name:'updateDate', index:'a.update_date', width:150, align:"center"}
	],
	// 加载成功后执行事件
	ajaxSuccess: function(data){
	}
});



function optHist(){
	if(false){
		$(".yn_show").hide();
	}else{
		if(0 == '0'){
			$("#status").val("待审批");
			$("#stop_status").show();
			$("#remove_status").hide();
		}else if(0 == '1'){
			$("#status").val("已审批");
			$("#stop_status").hide();
			$("#remove_status").show();
		}else if(0 == '2'){
			$("#status").val("已移除");
			$("#stop_status").show();
			$("#remove_status").hide();
		}
	}
}
