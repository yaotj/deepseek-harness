openapi: 3.0.3
info:
  title: 青岛地铁 ITP TVM 退款接口
  description: |
    IF2A-REFUND-01 requestRefund，根据订单号发起退款，退款金额为订单总金额。
    供 Apifox 导入测试使用。
  version: 1.0.0
servers:
  - url: http://localhost:48000
    description: 本地开发环境
paths:
  /itptvm/ci/tvm/requestRefund:
    post:
      tags:
        - TVM
      summary: IF2A-REFUND-01 退款
      description: |
        TVM 根据订单号发起退款请求，ITP 平台查询订单后调用支付中心退款接口。
        请求报文采用 application/x-www-form-urlencoded 格式，业务参数放在 bizData 字段中（JSON 字符串）。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - providerId
                - charset
                - format
                - timestamp
                - deviceId
                - signType
                - sign
                - bizData
              properties:
                providerId:
                  type: string
                  description: 服务提供商编码
                  example: "03"
                charset:
                  type: string
                  description: 字符集
                  example: "UTF-8"
                format:
                  type: string
                  description: 报文格式
                  example: "json"
                timestamp:
                  type: string
                  description: 请求时间戳 yyyyMMddHHmmss
                  example: "20260717133030"
                deviceId:
                  type: string
                  description: 设备编码
                  example: "06220801"
                signType:
                  type: string
                  description: 签名类型 00 表示无签名
                  example: "00"
                sign:
                  type: string
                  description: 签名字段
                  example: ""
                bizData:
                  type: string
                  description: 业务参数 JSON 字符串
                  example: '{"orderNo":"002026071715415727e6e1cc","refundReason":"主动退款"}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  retCode:
                    type: string
                    description: 返回码
                    example: "0000"
                  retMsg:
                    type: string
                    description: 返回消息
                    example: "成功"
                  refundResult:
                    type: string
                    description: 退款结果 SUCCESS-退款成功 FAILED-退款失败 PROCESSING-处理中
                    example: "PROCESSING"
                  refundResultDesc:
                    type: string
                    description: 退款结果描述
                    example: "退款请求已受理,退款中"
                  refundNo:
                    type: string
                    description: 退款单号
                    example: "RF20260717163015abcdef"
        default:
          description: 错误响应
          content:
            application/json:
              schema:
                type: object
                properties:
                  retCode:
                    type: string
                    example: "9999"
                  retMsg:
                    type: string
                    example: "订单号不能为空"
components:
  schemas:
    RequestRefundReqDTO:
      type: object
      description: IF2A-REFUND-01 退款请求业务参数
      properties:
        orderNo:
          type: string
          description: 订单号
          example: "002026071715415727e6e1cc"
        refundReason:
          type: string
          description: 退款原因（非必填）
          example: "主动退款"
    RequestRefundResult:
      type: object
      description: IF2A-REFUND-01 退款响应
      properties:
        retCode:
          type: string
          description: 返回码
          example: "0000"
        retMsg:
          type: string
          description: 返回消息
          example: "成功"
        refundResult:
          type: string
          description: 退款结果 SUCCESS-退款成功 FAILED-退款失败 PROCESSING-处理中
          example: "PROCESSING"
        refundResultDesc:
          type: string
          description: 退款结果描述
          example: "退款请求已受理,退款中"
        refundNo:
          type: string
          description: 退款单号
          example: "RF20260717163015abcdef"
