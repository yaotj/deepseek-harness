# 【历史 / v1，仅供回滚】2026-10-28 起生产已切到 applogs-pv-v2.yaml（PVC app-logs-v2）。
# 本文件不再用于新建，保留是因为 v1 的 PVC/PV 仍是回滚点，且记录了动态供给的原始形态。
#
# 应用共享日志盘 —— 挂到各服务 /home/javaapp/app/logs
# 后端：172.120.0.1:/ITP-PV（itpb-yw，1.1T 卷）；RWX 供多 Pod 共享；容量 400Gi
# 落地目录（provisioner 生成）：/ITP-PV/itpb-app-logs-pvc-<pv-uid>
# 跳板机访问方式见 README.md §5（fstab 已持久化，直接 mount /mnt/itp-pv）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-logs
  namespace: itpb
  labels:
    purpose: app-logs
spec:
  storageClassName: itpb-yw
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 400Gi
