[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itpops"
description = "青岛地铁 ITP 平台运维单一入口（itp-ops）：CloudOS / K8s / 日志 / 诊断 / 发布"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []          # 纯标准库；不引入第三方依赖

[project.scripts]
itp-ops = "itpops.cli:main"   # 可选：pipx install . 后可直接 `itp-ops <域> ...`

[tool.setuptools.packages.find]
include = ["itpops*"]

[tool.setuptools.dynamic]
version = { attr = "itpops.__version__" }

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
