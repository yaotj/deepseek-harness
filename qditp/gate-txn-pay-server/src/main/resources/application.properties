# recon-server 已于 2026-09-11 部署，下面是 `kubectl get svc -n itp` 实测的真实 Service 名。
# 注意 Service 端口等于 NodePort 号（30034），不等于容器 server.port（9112）。
service.recon.url=${SERVICE_RECON_URL:http://recon-server-bjzdy-svc.itp.svc:30034}
# 内部接口共享令牌：2026-09-11 起 X-Recon-Token 校验已按用户要求整段删除，本键**已无任何读取方**，
# 不需要注入。保留只为便于日后恢复鉴权（上线前 MUST 恢复）。
recon.internal-token=${RECON_INTERNAL_TOKEN:}
recon.export.temp-dir=${RECON_EXPORT_TEMP_DIR:/home/javaapp/app/recon-export}
