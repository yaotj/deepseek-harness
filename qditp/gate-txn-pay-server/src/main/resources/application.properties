# traceId 关联：micro/web 默认 management.tracing.enabled=false，此处为 gate-txn-pay 打开。
# 打开后 recon-server 下发 /internal/recon/export 时带来的 W3C traceparent 才能被续接进 MDC，
# 日志 pattern 的 %X{traceId} 才有值，否则按 sys_job_log（job 109 日终对账）的 traceId 检索本模块
# 的抽取日志会 0 条——对账链路是 web-admin → recon-server → 本模块，少一环就断在这里。
# 本模块没有自带 log4j2 配置、走公共 log4j2-linux.xml，其 pattern 已含 %X{traceId}，只差这个开关。
# 只需要 MDC 里的 traceId/spanId 供 VictoriaLogs 日志检索，span 上报一律不要。
management.tracing.enabled=true
management.tracing.sampling.probability=0
# NEVER 删除下面这行排除（口径同 pay-sign-server / card-pool-server）：
# 1) sampling.probability=0 只让本服务发起的 trace 不采样，采样器是 parentBased(traceIdRatioBased(0))，
#    上游带 sampled=1 的 traceparent / b3 头进来时 span 仍会被采样并进导出队列；
# 2) micro/web 的 web.properties 已把 management.otlp.tracing.endpoint 整行注释掉，本行是第二道保险——
#    K8s Deployment 只要注入 MANAGEMENT_OTLP_TRACING_ENDPOINT env 就会重新激活 exporter；
# 3) Boot 3.2.6 没有 management.tracing.export.enabled 这个开关，把 endpoint 置空也不行
#    （OtlpAutoConfiguration 只判断键是否存在），只能排掉整个自动配置。
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration

