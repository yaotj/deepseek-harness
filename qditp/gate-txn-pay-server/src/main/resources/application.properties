other.sql.database=${DB_NAME:AFCITPDB}
other.sql.username=${DB_USERNAME:qditp}
other.sql.password=${DB_PASSWORD:qditp}

# Druid WallFilter 由 resource/micro/sql-datasource 全局打开（commentAllow=false）：SQL 正文带注释或恒真谓词会被判成注入并静默失效，说明写在 mapper XML 的注释里。
