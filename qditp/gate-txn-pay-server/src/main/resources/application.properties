# subject / body MUST 写 \uXXXX 转义，NEVER 直接写中文：
# Spring Boot 的 OriginTrackedPropertiesLoader 按 ISO-8859-1 读 .properties，
# UTF-8 中文会被解成 mojibake 并原样送到支付中心。
# 下面两行分别是「地铁乘车扣费」「地铁乘车费用」。
gate.pay.subject=\u5730\u94c1\u4e58\u8f66\u6263\u8d39
gate.pay.body=\u5730\u94c1\u4e58\u8f66\u8d39\u7528
gate.pay.order-timeout-seconds=60
offline.billing.timeout-seconds=${OFFLINE_BILLING_TIMEOUT_SECONDS:1200}
offline.billing.timeout-fee-cents=${OFFLINE_BILLING_TIMEOUT_FEE_CENTS:300}
offline.billing.transfer-reduction-cents=${OFFLINE_BILLING_TRANSFER_REDUCTION_CENTS:100}
# 离线码金额重算失败订单的补偿扫表（DEBIT_STATUS=INIT + DISCOUNT_CALC_STATUS=OFFLINE_FARE_PENDING）
gate.pay.offline-fare-recovery-enabled=${GATE_PAY_OFFLINE_FARE_RECOVERY_ENABLED:true}
# 【2.0.73 起已废弃、无读取方】同上，改由 sys_job「离线码金额补偿」cron 0 0/1 * * * ? 控制。
gate.pay.offline-fare-recovery-poll-ms=${GATE_PAY_OFFLINE_FARE_RECOVERY_POLL_MS:60000}
gate.pay.offline-fare-recovery-batch-size=${GATE_PAY_OFFLINE_FARE_RECOVERY_BATCH_SIZE:50}
gate.pay.offline-fare-recovery-lookback-days=${GATE_PAY_OFFLINE_FARE_RECOVERY_LOOKBACK_DAYS:7}

app.acc-info.query-months=${APP_ACC_INFO_QUERY_MONTHS:3}

