# 【2026-09-15 实测修正，NEVER 回退成 /app/queryTotalAmt】钱包累计金额查询的路径。
# 原值 `/app/queryTotalAmt` **从来没通过一次** —— 拼出来的
# https://dtcustomer.bestonepay.com/testngbackV2/app/queryTotalAmt 恒返 404，于是
# FareCalculator.calculateWalletDiscount 每笔都掉进 catch、置 DISCOUNT_CALC_STATUS='FALLBACK'
# 按闸机原始金额扣款。全库 8 笔 PAYMENT_VENDOR='0B' 单实测**零条 SUCCESS**、
# DISCOUNT_RATE / WALLET_TOTAL_AMT / DISCOUNT_LEVEL_AMT 全为 NULL。
# 正确路径是 **/ci/app/v2/queryTotalAmt**，与同一 testngbackV2 上下文下那批
# receiveSignResult / employeeCardSync 同族前缀；实测
# {"thirdUserId":"00522943"} → {"totalAmt":0,"retCode":"0000","retMsg":"成功"}。
# 判据方法记一笔：**该网关不会对不存在的方法一律 404**（对照组
# /ngpayment-gateway/api/v1/contract/queryResult 用 GET 就返 200 + 业务报文 code=1001），
# 因此「GET 返 404」在这个网关上等于**路径不存在**，可以拿来排除路径猜测。
# 另两条实测事实：①bizData 里**只有 thirdUserId 是关键字段**，cardType / msisdn /
# cardIssueCode / extend1 / extend2 送不送都返 0000；②thirdUserId MUST 是 ITP 用户号
# （8 位，如 00522943，即 GATE_TXN_PAY.THIRD_USER_ID），**NEVER 送支付宝 uid 或
# PAY_USER_ID** —— 送后者实测返 {"retCode":"7001","retMsg":"找不到对应的数据"}。
# ③multipart/form-data 对端接受，不必改成 x-www-form-urlencoded。
# 仍未闭合：基址还是 testngbackV2 测试地址（见上面 wallet.app-gateway-url），上生产前 MUST 换；
# 且实测 totalAmt=0 而该用户在我方有 8 笔扣费，**这个 0 是不是真值待接口方确认**。
wallet.app-query-total-amt-path=${WALLET_APP_QUERY_TOTAL_AMT_PATH:/ci/app/v2/queryTotalAmt}
wallet.app-provider-id=01
wallet.app-charset=utf-8
wallet.app-format=json
wallet.app-sign-type=00
# 下面两个 client（推送 / 换乘资格查询）对接的是**外部公交卡系统**，2026-09-14 起继承 ProxyWebClient：
# 拿到连接池与统一日志，两个 *-timeout-ms 经构造器传给 responseTimeout（NEVER 靠覆写 getResponseTimeout
# 读注入字段，那个方法在父类构造期就被调、那时子类字段还是 0）。两个 URL 都是**完整地址**，
# 既当 baseUrl 又当请求 URL，WebClient 对带 host 的绝对地址直接用、不会二次拼接。
# 【2026-09-15 实测修正，NEVER 回退】两个地址原本都写 8980，且推送那条还漏了 /buscard 上下文路径。
# **这不是我方笔误**：对端开发期给的接口文档原文写的就是 8980 + /busApi/2App/v1/pushMetroTran，
# 代码是照文档写的 —— 是**对端后来把服务挪到 8885 + /buscard 上下文、文档没同步**。
# 因此「代码与对端文档一致」**不能当作地址正确的判据**，联调前 MUST 现探。
# 实测 8980 上**任何路径都返 404**（Tomcat 默认 404 页），公交卡系统真实端口是 **8885**、
# 且两个接口都在 **/buscard** 上下文下。判据是从 k8s-master 用 **GET** 探路：
# GET 返 405「方法不允许」即「路径存在、只收 POST」—— 8885 上
# /buscard/busApi/2App/v1/{pushMetroTran,checkMetroTransfer} 都是 405，8980 上全 404。
# **探路 MUST 用 GET、NEVER 用 POST**：POST 会真给公交卡系统推一条行程、可能真发换乘优惠。
# 改对地址后推送返 `{"retCode":"1002","retMsg":"接收地铁交易数据失败null"}`（HTTP 200），
# 即**链路已通、对端业务侧仍在拒**；retMsg 尾巴那个 `null` 是对端拼错误消息时拼进去的空变量，
# 已请接口方查服务端异常栈。同一份数据换三种报文形态（bizData 字符串 / 嵌套对象 / 平铺六字段）
# 回的**完全一样**，因此 **NEVER 靠改报文结构去试** —— 对端没走到解析结构那步就拒了。
# 查询那条的坑更隐蔽：它路径一直是对的、**只端口错**，而失败后 FareCalculator 走
# 「非钱包/算不出减免」分支、不像推送那样往 LAST_ERROR 留痕，于是**一直静默失效、没人发现**。
wallet.metro-transfer-url=${WALLET_METRO_TRANSFER_URL:http://172.20.202.10:8885/buscard/busApi/2App/v1/pushMetroTran}
wallet.metro-transfer-open-logger=${WALLET_METRO_TRANSFER_OPEN_LOGGER:false}
wallet.metro-transfer-check-url=${WALLET_METRO_TRANSFER_CHECK_URL:http://172.20.202.10:8885/buscard/busApi/2App/v1/checkMetroTransfer}
wallet.metro-transfer-check-open-logger=${WALLET_METRO_TRANSFER_CHECK_OPEN_LOGGER:false}
wallet.metro-transfer-check-timeout-ms=${WALLET_METRO_TRANSFER_CHECK_TIMEOUT_MS:3000}
wallet.metro-transfer-enabled=${WALLET_METRO_TRANSFER_ENABLED:false}
wallet.metro-transfer-timeout-ms=${WALLET_METRO_TRANSFER_TIMEOUT_MS:3000}
# 【2.0.73 起已废弃、无读取方】原为 MetroTransferPushTaskProcessor 的 @Scheduled(fixedDelayString)，
# 现在轮询周期由 web-admin 的 sys_job「公交换乘推送」cron 控制（0 0/1 * * * ?，即 10s -> 60s）。
# 保留本行只为让「改了这个值却没生效」的人看到原因，NEVER 靠改它调频率。
wallet.metro-transfer-poll-ms=${WALLET_METRO_TRANSFER_POLL_MS:10000}
wallet.metro-transfer-batch-size=${WALLET_METRO_TRANSFER_BATCH_SIZE:50}
wallet.metro-transfer-max-retry=${WALLET_METRO_TRANSFER_MAX_RETRY:10}
wallet.metro-transfer-processing-lease-seconds=${WALLET_METRO_TRANSFER_PROCESSING_LEASE_SECONDS:120}

