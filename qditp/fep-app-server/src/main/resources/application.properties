server.port=9101
spring.application.name=fep-app
other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true
knife4j.production=false

# 服务间调用地址：默认值一律用集群内网 Service 名（`kubectl get svc -n itp` 实测，2026-09-11）。
# NEVER 写 127.0.0.1（在 K8s 里等于打到自己），也 NEVER 删键（键缺失时 rpc 退化成默认服务名 `*-service`、DNS 解析不到）。
# Service 端口不统一：account 9098 / ticket 9100 等于容器端口；security / paySign / blacklist / key 是 8080；
# para 30026 / gateTxnPay 30019 / industryData 30018 / dailyTicket 30027 / collectPay 30024 等于 NodePort 号。
# 照抄实测值，NEVER 按 server.port 推断。
service.account.url=${SERVICE_ACCOUNT_URL:http://account-n4ba6-svc.itp.svc:9098}
service.account.openLogger=true

service.security.url=${SERVICE_SECURITY_URL:http://security-server-8h3eo-svc.itp.svc:8080}
service.security.openLogger=true

service.paySign.url=${SERVICE_PAY_SIGN_URL:http://pay-sign-server-hsa9w-svc.itp.svc:8080}
service.paySign.openLogger=true

service.blacklist.url=${SERVICE_BLACKLIST_URL:http://blacklist-server-wmfzs-svc.itp.svc:8080}
service.blacklist.openLogger=true

service.key.url=${SERVICE_KEY_URL:http://key-server-vcbmt-svc.itp.svc:8080}
service.key.openLogger=true

service.ticket.url=${SERVICE_TICKET_URL:http://ticket-server-bsyju-svc.itp.svc:9100}
service.ticket.openLogger=true

service.industryData.url=${SERVICE_INDUSTRY_DATA_URL:http://industry-data-server-6dv5u-svc.itp.svc:30018}
service.industryData.openLogger=true

service.para.url=${SERVICE_PARA_URL:http://para-server-pufrl-svc.itp.svc:30026}
service.para.openLogger=true

service.dailyTicket.url=${SERVICE_DAILY_TICKET_URL:http://daily-ticket-server-rdbe5-svc.itp.svc:30027}
service.dailyTicket.openLogger=true

service.gateTxnPay.url=${SERVICE_GATE_TXN_PAY_URL:http://gate-txn-pay-server-jomf4-svc.itp.svc:30019}
service.gateTxnPay.openLogger=true

# 2026-09-15 新增：IF8A-26 补款下单已迁入 face-pay-server，地址与 web-admin 的 service.facePay.url 保持一致。
service.facePay.url=${FACE_PAY_SERVICE_URL:http://face-pay-server-svc.itp.svc:30025}
service.facePay.openLogger=true

# 2026-09-11 补齐：此键此前整条缺失，运行时落到 rpc 默认服务名 `collect-pay-service`、DNS 解析不到。
service.collectPay.url=${SERVICE_COLLECT_PAY_URL:http://collect-pay-c23ku-svc.itp.svc:30024}
service.collectPay.openLogger=true

# 2026-09-14 新增：IF8A-05 / IF8A-41 / IF8A-34 三个交易查询已由 ticket-server 切到 trans-query-server。
# 默认值取 `kubectl get svc -n itp` 实测的 `trans-query-57wpd-svc`（NodePort 与 Service 端口同为 30035）。
# ticket-server 上那三个同路径端点仍在、未删，回滚只需把 TicketAppServiceImpl 的三处换回 ticketClient。
service.transQuery.url=${SERVICE_TRANS_QUERY_URL:http://trans-query-57wpd-svc.itp.svc:30035}
service.transQuery.openLogger=true

industry.issue-channel-code=01
