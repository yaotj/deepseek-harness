server.port=9098
spring.application.name=account

# 数据库地址：测试/生产环境均由 K8s Deployment 注入 DB_HOST / DB_NAME / DB_USERNAME / DB_PASSWORD。
# 默认值与 ticket-server 对齐，防止 dot-name env var（如 other.sql.host）在某些运行时未被 Spring Boot 识别。
other.sql.host=${DB_HOST:172.20.222.3:1521}
other.sql.double-datasource=false
other.sql.type=oracle
other.sql.page.type=oracle
other.sql.database=${DB_NAME:AFCITPDB}
other.sql.username=${DB_USERNAME:qditp}
other.sql.password=${DB_PASSWORD:qditp}

other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true

knife4j.production=true

# traceId 关联（2026-10-14 接入，「三行成组」）：账户开户核心，被 fep-app/支付宝链路依赖。
# 只需要 MDC 里的 traceId/spanId 供 VictoriaLogs 日志检索，span 上报一律不要。
# NEVER 删第三行排除：Deployment 一旦注入 MANAGEMENT_OTLP_TRACING_ENDPOINT 就会起 OTLP exporter。
management.tracing.enabled=true
management.tracing.sampling.probability=0
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration


# 服务间调用地址：默认值一律用集群内网 Service 名（`kubectl get svc -n itp` 实测，2026-09-11）。
# NEVER 写 127.0.0.1（在 K8s 里等于打到自己），也 NEVER 删键（键缺失时 rpc 退化成默认服务名 `*-service`、DNS 解析不到）。
service.ticket.openLogger=true
service.ticket.url=${SERVICE_TICKET_URL:http://ticket-server-bsyju-svc.itp.svc:9100}

service.security.url=${SERVICE_SECURITY_URL:http://security-server-8h3eo-svc.itp.svc:8080}
service.security.openLogger=true

service.paySign.url=${SERVICE_PAY_SIGN_URL:http://pay-sign-server-hsa9w-svc.itp.svc:8080}
service.paySign.openLogger=true

service.gateTxnPay.url=${SERVICE_GATE_TXN_PAY_URL:http://gate-txn-pay-server-jomf4-svc.itp.svc:30019}
service.gateTxnPay.openLogger=true

app.user-cancel.check-unsettled=true



mybatis.mapper-locations=classpath*:mapper/*.xml

service.cardPool.url=${CARD_POOL_URL:http://card-pool-server-86mc1-svc.itp.svc:30033}
service.cardPool.openLogger=true

itp.providerId=01


itp.charset=UTF-8
itp.format=json
itp.signKey=bc4f7c96259acf9946094fa

# 员工码外部接口。确认对端地址后填写 URL。
employee-card.app-register-url=https://dtcustomer.bestonepay.com/testngbackV2/ci/app/v2/employeeCardSync
employee-card.acc-query-url=
employee-card.acc-activate-url=${EMPLOYEE_CARD_ACC_ACTIVATE_URL:http://172.20.211.11:32605/api/v1/employee_card/activate}
employee-card.provider-id=06
employee-card.charset=UTF-8
employee-card.format=json
employee-card.device-id=ITP
employee-card.sign-type=00
# 单次推送 APP 的最大卡片数，超出后分片调用
employee-card.app-batch-size=200
employee-card.connect-timeout-ms=3000
employee-card.read-timeout-ms=10000
