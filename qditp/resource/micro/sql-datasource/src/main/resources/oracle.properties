spring.datasource.url=jdbc:oracle:thin:@${other.sql.host}/${other.sql.database}
spring.datasource.username=${other.sql.username}
spring.datasource.password=${other.sql.password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
#
# 虚拟线程 pinning 兜底：socket 读超时直接限制单次慢 SQL 的 pin 时长上限。
# ojdbc8 的 PhysicalConnection / OracleStatement 大量方法是 synchronized，JDK 21 未落地 JEP 491，
# 虚拟线程在 synchronized 内阻塞会 pin 载体线程；一条慢 SQL 就等于把一个载体线程 pin 住同样长的时间。
# 这里 10s 的 ReadTimeout 让 DB 响应超过 10s 的语句直接抛 SocketTimeoutException，
# pin 的载体线程立刻释放，不再拖到 remove-abandoned-timeout。
# 已在 2026-08-26 pay-sign-server 生产事故中观察到「对端 17ms 答完、本端 287s 才处理」的形态，
# 根因就是载体线程被 pin 满后虚拟线程停止调度。
# 长耗时批量任务（对账抽取等）已显式切到 newFixedThreadPool 平台线程上跑，不受此限制。
spring.datasource.druid.connection-properties=oracle.jdbc.ReadTimeout=10000
