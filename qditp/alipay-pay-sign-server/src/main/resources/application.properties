# NEVER 删除下面这行排除（2026-09-11 加）：
# 本模块 K8s Deployment 注入了 env `management.tracing.enabled=true`（同族的 alipay-account-server /
# fep-alipay 都没有），配合 1.1.15 镜像里旧版 micro/web 仍打开的 management.otlp.tracing.endpoint，
# OtlpAutoConfiguration 会建出 SpanExporter，导出线程每批抛
# `UnknownHostException: collector-istio-traces-service.opentelemetry`（该 collector 在集群里不存在）刷 ERROR。
# Boot 3.2.6 没有 management.tracing.export.enabled 开关，endpoint 置空也不行（只判断键是否存在），
# 只能排掉整个自动配置；排掉后 Tracer 与 MDC 的 traceId/spanId 照旧，仅不再创建 SpanExporter。
# 与 pay-sign-server/application.properties:28 同一处理方式。
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration

other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true
knife4j.production=false

# 服务间调用地址：默认值一律用集群内网 Service 名（`kubectl get svc -n itp` 实测，2026-09-11）。
# NEVER 写 127.0.0.1（等于打到自己），也 NEVER 写 `http://<模块名>:8080` 裸名（Service 名都带随机后缀，解析不到）。
# 本模块的 `service.account` 指的是**支付宝开户服务**（alipay-account-server），不是 account-server。
