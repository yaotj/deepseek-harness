# 调度日志「执行日志」检索：VictoriaLogs 查询地址（只读）。
# 与各模块推送用的 VLOGS_URL 是同一个 VictoriaLogs，但路径不同：推送走 /insert/jsonline，检索走 /select/logsql/query。
# 只填 scheme://host:port 时代码自动补 /select/logsql/query。留空即禁用该功能，前台会提示未配置。
vlogs.query-url=${VLOGS_QUERY_URL:}
vlogs.query-timeout-millis=8000
# 检索时间窗：以 sys_job_log.create_time（≈执行结束点）为基准，
#   start = create_time - 耗时(从 job_message 解析) - query-window-before-millis
#   end   = create_time + query-window-after-millis
# 后置余量默认 30 分钟且明显大于前置：批处理任务返回后下游常仍在跑（异步线程池 / @Scheduled 补偿 /
# 超时重试），这些日志时间戳晚于 create_time，尾部窗口太小就查不到。
# 放宽窗口时 query-limit MUST 同步跟上——VictoriaLogs 的 limit 不保证顺序，截断是随机丢弃。
vlogs.query-window-before-millis=300000
vlogs.query-window-after-millis=1800000
vlogs.query-limit=2000
