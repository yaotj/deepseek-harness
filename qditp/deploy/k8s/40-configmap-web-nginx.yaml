apiVersion: v1
data:
  nginx.conf: "# ==========================================\n# Web 管理前端 - E7501 生产环境适配版\n# ==========================================\n\n# ⚠️ E7501 适配：注释掉 user 和 pid，避免容器权限问题导致 Pod CrashLoopBackOff\n# user  nginx;\n# pid   /var/run/nginx.pid;\n\nworker_processes auto;\n# ⚠️ E7501 适配：注释掉 error_log 文件路径，避免目录不存在报错\n# error_log /var/log/nginx/error.log warn;\n\nevents {\n    worker_connections  1024;\n}\n\nhttp {\n    default_type  application/octet-stream;\n\n    # MIME 类型映射（E7501 资源包模式替代 /etc/nginx/mime.types）\n    types {\n        text/html                             html;\n        text/css                              css;\n        text/xml                              xml;\n        text/plain                            txt;\n        application/json                      json;\n        application/javascript                js;\n        application/xml+rss                   rss;\n        application/atom+xml                  atom;\n        image/svg+xml                         svg;\n        image/png                             png;\n        image/jpeg                            jpeg jpg;\n        image/gif                             gif;\n        image/webp                            webp;\n        font/woff                             woff;\n        font/woff2                            woff2;\n        application/vnd.ms-fontobject         eot;\n        font/ttf                              ttf;\n    }\n\n    # 日志格式（增加 request_time 便于排查慢接口）\n    log_format main '$remote_addr - [$time_local] \"$request\" '\n                    '$status $body_bytes_sent $request_time '\n                    '\"$http_referer\" \"$http_user_agent\" \"$http_x_forwarded_for\"';\n\n    # ⚠️ E7501 适配：注释掉 access_log 文件路径\n    # access_log /var/log/nginx/access.log main;\n\n    # Gzip 压缩\n    gzip  on;\n    gzip_min_length 1k;\n    gzip_comp_level 5;\n    gzip_types\n        text/plain\n        text/css\n        text/xml\n        text/javascript\n        application/json\n        application/javascript\n        application/xml+rss\n        application/atom+xml\n        image/svg+xml;\n\n    # 禁用服务器版本信息\n    server_tokens off;\n\n    # 上游后端服务\n    upstream web_backend {\n        server 172.20.211.23:30028;\n    }\n\n    server {\n        listen       80;\n        server_name  _;  # 替换为实际域名，如 admin.qdmetro.com\n\n        # 前端静态资源根目录\n        root   /usr/share/nginx/html;\n        index  index.html;\n\n        # 请求超时设置\n        proxy_connect_timeout 60s;\n        proxy_send_timeout    60s;\n        proxy_read_timeout    60s;\n\n        # ========== 安全响应头 ==========\n        add_header X-Frame-Options \"SAMEORIGIN\" always;\n        add_header X-XSS-Protection \"1; mode=block\" always;\n        add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;\n\n        # ==========================================\n        # 前端静态资源缓存\n        # ==========================================\n        location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {\n            expires 1y;\n            add_header Cache-Control \"public, immutable, no-transform\";\n            add_header X-Content-Type-Options \"nosniff\";\n            access_log off;\n        }\n\n        # HTML 文件不缓存\n        location ~* \\.html$ {\n            expires -1;\n            add_header Cache-Control \"no-cache, no-store, must-revalidate\";\n        }\n\n        # ==========================================\n        # 前端路由 History 模式支持\n        # ==========================================\n        location / {\n            try_files $uri $uri/ /index.html;\n        }\n\n        # ========== 后端 API 反向代理 ==========\n        # /prod-api/users → 转发为 /users（末尾 / 实现去前缀）\n        location /prod-api/ {\n            # Istio Envoy 适配：必须使用 HTTP/1.1\n            proxy_http_version 1.1;\n\n            # Istio Envoy 适配：显式设置 Connection 头，避免 Nginx 默认发送 close\n            proxy_set_header Connection \"\";\n\n            proxy_pass http://web_backend/;\n\n            proxy_set_header Host              $host;\n            proxy_set_header X-Real-IP         $remote_addr;\n            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n\n            client_max_body_size 20M;\n        }\n\n        location /web-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30028/;\n            rewrite ^/web-server/(.*) /$1 break;\n        }\n\n        location /para-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30026/;\n            rewrite ^/para-server/(.*) /$1 break;\n        }\n        location /blacklist-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30017/;\n            rewrite ^/blacklist-server/(.*) /$1 break;\n        }\n        location /daily-ticket-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30027/;\n            rewrite ^/daily-ticket-server/(.*) /$1 break;\n        }\n        # collect-pay-server（30024）：已退居后台，只服务旧单（TBL_TVM_ORDER_PAY）。\n        # 当面付订单查询页已于 2026-09-15 改走下面的 /face-pay-server，本段 NEVER 再指向 30025。\n        location /collect-pay-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30024/;\n            rewrite ^/collect-pay-server/(.*) /$1 break;\n        }\n        # face-pay-server（30025，face-pay-server-svc）：TVM/BOM/APP 当面付现行主模块（F2F_* 表），ADR-D85。\n        # 运营页 /page/face-pay/orders 与其退款端点都走这里；本段与前端 web/src/api/trans/facePayOrder.js 成对，改一处 MUST 改另一处。\n        location /face-pay-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30025/;\n            rewrite ^/face-pay-server/(.*) /$1 break;\n        }\n        location /alipay-account-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30021/;\n            rewrite ^/alipay-account-server/(.*) /$1 break;\n        }\n        location /account-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30013/;\n            rewrite ^/account-server/(.*) /$1 break;\n        }\n\n        location /pay-sign-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30016/;\n            rewrite ^/pay-sign-server/(.*) /$1 break;\n        }\n\n        location /ticket-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30014/;\n            rewrite ^/ticket-server/(.*) /$1 break;\n        }\n\n        location /gate-txn-pay-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30019/;\n            rewrite ^/gate-txn-pay-server/(.*) /$1 break;\n        }\n\n        location /para1-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30026/;\n            rewrite ^/para1-server/(.*) /$1 break;\n        }\n\n        location /card-pool-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://card-pool-server-86mc1-svc.itp.svc:30033/;\n            rewrite ^/card-pool-server/(.*) /$1 break;\n        }\n\n        # key-server（key-server-vcbmt-svc，容器 8080 / NodePort 30015）：密钥版本汇总只读页。\n        # 本段与前端 web/src/api/trans/keyVersion.js 的 /key-server/page/key/versions 成对，改一处 MUST 改另一处。\n        location /key-server {\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            proxy_set_header X-real-ip $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header origin \"\";\n            proxy_connect_timeout 10s;\n            proxy_read_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_pass      http://172.20.211.23:30015/;\n            rewrite ^/key-server/(.*) /$1 break;\n        }\n\n\n\n        # ========== K8s 健康检查 ==========\n        location /health {\n            access_log off;\n            return 200 \"healthy\";\n            add_header Content-Type text/plain;\n        }\n\n        error_page 500 502 503 504 /50x.html;\n        location = /50x.html {\n            root /usr/share/nginx/html;\n        }\n    }\n}\n"
kind: ConfigMap
metadata:
  labels:
    cm-name: websyspresetweb
  name: websyspresetweb-version-1.29
  namespace: itp
