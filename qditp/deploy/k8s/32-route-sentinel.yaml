# route-sentinel 测试环境基线（SCG 透明分流网关）
# 端口 9999；VirtualService fep-app-vr 的 5 条 exact 路由指向本 Service。
# ⚠ 2026-11-02 起已由 CloudOS 平台接管（应用 uuid eab9c5cca7424fcab687ad489d25f7cd，应用组 ITP），
# 本文件降级为基线快照/应急恢复用。改配置 MUST 走平台 advanced-config（kubectl 改动会被平台回收）；
# 平台 YAML 模式仅收单文档 Deployment（无注释、多文档/Service 会被 checkYaml 拒）。
# 接管方法：checkYaml 预演 → 删同名原生 Deployment → POST /appgroups/{group}/apps（撞名即 failed 且无错误信息，平台特性）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-sentinel
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: route-sentinel
  template:
    metadata:
      labels:
        app: route-sentinel
    spec:
      containers:
      - name: route-sentinel
        image: os-harbor-svc.default.svc.cloudos:443/itp/route-sentinel:1.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9999
          name: http
          protocol: TCP
        env:
        - name: DB_PASSWORD
          value: qditp
        - name: TZ
          value: Asia/Shanghai
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9999
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9999
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: route-sentinel-svc
  namespace: itp
spec:
  selector:
    app: route-sentinel
  ports:
  - name: http
    port: 8080
    targetPort: 9999
    protocol: TCP
