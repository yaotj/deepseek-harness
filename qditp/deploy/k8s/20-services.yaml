# route-sentinel service 追加到现有文件末尾
apiVersion: v1
kind: Service
metadata:
  labels:
    app: route-sentinel
  name: route-sentinel-svc
  namespace: itp
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: route-sentinel
  type: ClusterIP

# 集群内网 Service（<app>-internal）：服务间调用专用，port/targetPort 统一 8080
# 与平台生成的 NodePort Service（<app>-<5位后缀>-svc，对外/联调在用）并存，互不影响
# 背景：平台给各应用注入 server.port/SERVER_PORT/CARD_POOL_PORT=9xxx 导致与 targetPort 8080 错配，
#       统一 8080 后服务间调用一律走 http://<app>-internal.itp.svc:8080（见 docs/tracking/IT-035-*.md）
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: account
    itp-role: internal
  name: account-internal
  namespace: itp
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: account
  type: ClusterIP
---
