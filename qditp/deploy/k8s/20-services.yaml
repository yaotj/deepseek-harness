# route-sentinel service 追加到现有文件末尾
apiVersion: v1
kind: Service
metadata:
  labels:
    app: route-sentinel
  name: route-sentinel-svc
  namespace: itp
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: route-sentinel
  type: ClusterIP

# ============================================================================
# 集群内网 Service（<app>-internal）：服务间调用专用，port/targetPort 统一 8080
#   - 与平台生成的 NodePort Service（<app>-<5位后缀>-svc，对外/联调在用）并存，互不影响
#   - 这 23 个对象已由云管台纳管（POST /api/cloud/app-mgmt/v1.0/apps/{uuid}/service），
#     平台是它们运行态的真源；本文件仅作基线快照 / 应急重建用，手工 apply 出的对象
#     不会被平台认领（重装应用时会丢），MUST 走平台接口创建
#   - 背景：平台给各应用注入 server.port/SERVER_PORT/CARD_POOL_PORT=9xxx 导致与 targetPort
#     8080 错配 → 详见 docs/tracking/IT-035-平台端口变量与应用监听口径错配致批量503.md
# ============================================================================
