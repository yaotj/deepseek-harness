apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: es-server
  name: es-server
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: es-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: es-server
    spec:
      containers:
      - env:
        - name: ftp.excel-dir
          value: d://
        - name: logging.file.path
          value: logs/acc-es
        - name: mybatis.configuration.log-impl
          value: org.apache.ibatis.logging.stdout.StdOutImpl
        - name: other.sql.double-datasource
          value: 'false'
        - name: other.web.enableLogRequestInFilter
          value: 'true'
        - name: other.web.enableBodyCacheFilter
          value: 'true'
        - name: ftp.password
          valueFrom:
            secretKeyRef:
              name: itp-secrets
              key: ftp.password
        - name: excel-path
          value: excels/
        - name: logging.level.com.chinasofti.huateng.acc.es.manage.server.mapper
          value: debug
        - name: pagehelper.params
          value: count
        - name: mybatis.mapper-locations
          value: classpath:mapper/*Mapper.xml
        - name: pagehelper.reasonable
          value: 'true'
        - name: knife4j.production
          value: 'false'
        - name: ftp.ip
          value: 10.4.22.69
        - name: server.port
          value: '8080'
        - name: pagehelper.helper-dialect
          value: oracle
        - name: other.sql.username
          value: qditp
        - name: other.web.enableLogTakeTimesInInterceptor
          value: 'true'
        - name: other.sql.host
          value: 172.20.222.3:1521
        - name: ftp.username
          value: ftpuser
        - name: ftp.report-target-dir
          value: upload/
        - name: spring.application.name
          value: acc-es
        - name: ftp.custom-target-dir
          value: download/
        - name: ftp.port
          value: '21'
        - name: netty.port
          value: '5000'
        - name: pageConfig.defaultSize
          value: '10'
        - name: other.sql.page.type
          value: oracle
        - name: other.web.unSafeUrlChars
          value: 'null'
        - name: other.sql.password
          valueFrom:
            secretKeyRef:
              name: itp-secrets
              key: other.sql.password
        - name: other.sql.database
          value: AFCITPDB
        - name: other.sql.type
          value: oracle
        - name: ftp.custom-local-dir
          value: d://
        - name: mybatis.configuration.map-underscore-to-camel-case
          value: 'true'
        - name: ftp.report-local-dir
          value: d://
        - name: SERVICE_NAME
          value: es-server
        - name: NAMESPACE
          value: itp
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        image: os-harbor-svc.default.svc.cloudos:443/itp/acc-es-server:2.0.21
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: es-server
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-3c0pdbsy0
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-3c0pdbsy0
