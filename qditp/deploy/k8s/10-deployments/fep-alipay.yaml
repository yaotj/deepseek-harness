apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: fep-alipay
  name: fep-alipay
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fep-alipay
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fep-alipay
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        # DB_* 下划线命名：Spring Boot relaxed binding 对 dot-name env var（如 other.sql.host）识别不稳定
        # （2026-10-14 实测 + 2026-11-02 发版现场复验：web 2.0 jar 下点号 env 不生效、服务静默连默认红库）。
        # other.sql.* 点号 env 保留仅作兼容性备份。2026-11-02 IT-036 对齐 para-server 双通道模式。
        - name: DB_HOST
          value: 172.20.222.3:1521
        - name: DB_NAME
          value: AFCITPDB
        - name: DB_USERNAME
          value: qditp

        - name: DB_PASSWORD

          value: qditp
        # JVM 堆 = max_memory - reserved_memory - max_direct_memory（基础镜像 startapp.sh，见 docs/tracking/IT-020）
        - name: max_memory
          value: '4000'
        - name: reserved_memory
          value: '1000'
        - name: max_direct_memory
          value: '100'
        - name: MY_POD_UUID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: management.tracing.enabled
          value: 'true'
        - name: management.tracing.sampling.probability
          value: '0'
        - name: spring.autoconfigure.exclude
          value: org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
        - name: service.blacklist.openLogger
          value: 'true'
        - name: alipay.notify.push-trans-data-url
          value: https://openapi.alipay.com/gateway.do
        - name: service.key.openLogger
          value: 'true'
        - name: other.web.enableLogRequestInFilter
          value: 'true'
        - name: other.web.enableBodyCacheFilter
          value: 'true'
        - name: server.tomcat.basedir
          value: ./logs
        - name: alipay.notify.close-result-url
          value: https://openapi.alipay.com/gateway.do
        - name: knife4j.production
          value: 'false'
        - name: service.para.openLogger
          value: 'true'
        - name: service.ticket.url
          value: http://172.20.211.23:30014
        - name: industry.issue-channel-code
          value: '07'
        - name: SERVER_PORT
          value: '8080'
        - name: service.security.openLogger
          value: 'true'
        - name: alipay.notify.blacklist-url
          value: https://openapi.alipay.com/gateway.do
        - name: service.ticket.openLogger
          value: 'true'
        - name: other.web.enableLogTakeTimesInInterceptor
          value: 'true'
        - name: service.account.url
          value: http://172.20.211.23:30021
        - name: service.security.url
          value: http://127.0.0.1:9012
        - name: service.alipay-pay-sign.openLogger
          value: 'true'
        - name: service.paySign.url
          value: http://172.20.211.23:30022
        - name: spring.application.name
          value: fep-alipay
        - name: service.industryData.openLogger
          value: 'true'
        - name: service.key.url
          value: http://127.0.0.1:9103
        - name: service.para.url
          value: http://127.0.0.1:9107
        - name: service.blacklist.url
          value: http://172.20.211.23:30017
        - name: service.industryData.url
          value: http://172.20.211.23:30018
        - name: other.web.unSafeUrlChars
          value: 'null'
        - name: alipay.notify.card-data-url
          value: https://openapi.alipay.com/gateway.do
        - name: service.account.openLogger
          value: 'true'
        - name: service.paySign.openLogger
          value: 'true'
        - name: service.alipay-pay-sign.url
          value: http://172.20.211.23:30022
        - name: SERVICE_NAME
          value: fep-alipay
        - name: NAMESPACE
          value: itp
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        - name: service.transQuery.url
          value: http://trans-query-57wpd-svc.itp.svc:30035
        - name: service.transQuery.openLogger
          value: 'true'
        image: os-harbor-svc.default.svc.cloudos:443/itp/fep-alipay:1.0.76
        imagePullPolicy: Always
        lifecycle: {}
        name: fep-alipay
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /monitor/health
            port: 8080
            scheme: HTTP
          # P2-9（2026-11-02）：readiness 进基线，消除「Spring 卡 refresh / 8080 未监听 → Pod 假 Ready」观测盲区（IT-036）。
          # 仅 readiness 不配 liveness（liveness 会重启 Pod，高危）；initialDelay 60s 覆盖慢启动，failureThreshold×period=60s 兜底。
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-1b3m09qw0
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-1b3m09qw0
