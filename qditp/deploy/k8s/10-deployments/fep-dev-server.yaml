apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: fep-dev-server
  name: fep-dev-server
  namespace: itp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fep-dev-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fep-dev-server
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: fep-dev-server
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - env:
        # JVM 堆 = max_memory - reserved_memory - max_direct_memory（基础镜像 startapp.sh，见 docs/tracking/IT-020）
        - name: max_memory
          value: '4000'
        - name: reserved_memory
          value: '1000'
        - name: max_direct_memory
          value: '100'
        - name: MY_POD_UUID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: management.tracing.enabled
          value: 'true'
        - name: management.tracing.sampling.probability
          value: '0'
        - name: spring.autoconfigure.exclude
          value: org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
        - name: spring.application.name
          value: fep-dev
        - name: other.web.enableLogRequestInFilter
          value: 'true'
        - name: other.web.enableBodyCacheFilter
          value: 'true'
        - name: service.gateTxnPay.url
          value: http://172.20.211.23:30019
        - name: alipay.notify.pay-callback-url
          value: https://dtcustomer.bestonepay.com/ngopenplatform/api/payment/requestPay
        - name: service.key.url
          value: http://172.20.211.200:30015
        - name: pay.center.callback-url
          value: http://58.56.166.170:48000/fep-alipay/notify/payment/payNotify
        - name: service.para.url
          value: http://172.20.211.23:30026
        - name: other.web.unSafeUrlChars
          value: 'null'
        - name: service.gateTxnPay.openLogger
          value: 'true'
        - name: knife4j.production
          value: 'false'
        - name: service.account.openLogger
          value: 'true'
        - name: service.para.openLogger
          value: 'true'
        - name: service.ticket.url
          value: http://172.20.211.23:30014
        - name: DB_HOST
          value: 172.20.222.3:1521
        - name: DB_NAME
          value: AFCITPDB
        - name: DB_USERNAME
          value: qditp
        - name: DB_PASSWORD
          value: qditp
        - name: other.sql.host
          value: 172.20.222.3:1521
        - name: other.sql.double-datasource
          value: 'false'
        - name: other.sql.type
          value: oracle
        - name: other.sql.page.type
          value: oracle
        - name: other.sql.database
          value: AFCITPDB
        - name: other.sql.username
          value: qditp
        - name: other.sql.password
          value: qditp
        - name: mybatis.mapper-locations
          value: classpath*:mapper/*.xml
        - name: SERVER_PORT
          value: '9104'
        - name: service.security.openLogger
          value: 'true'
        - name: service.ticket.openLogger
          value: 'true'
        - name: other.web.enableLogTakeTimesInInterceptor
          value: 'true'
        - name: service.account.url
          value: http://172.20.211.23:30013
        - name: service.alipay-pay-sign.url
          value: http://172.20.211.23:30022
        - name: service.security.url
          value: http://172.20.211.23:30012
        - name: SERVICE_NAME
          value: fep-dev-server
        - name: NAMESPACE
          value: itp
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        image: os-harbor-svc.default.svc.cloudos:443/itp/fep-dev-server:2.0.71
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: fep-dev-server
        ports:
        - containerPort: 9104
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-bk1ygqwa0
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-bk1ygqwa0
