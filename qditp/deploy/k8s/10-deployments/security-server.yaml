apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: security-server
  name: security-server
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: security-server
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        # DB_* 下划线命名：Spring Boot relaxed binding 对 dot-name env var（如 other.sql.host）识别不稳定
        # （2026-10-14 实测 + 2026-11-02 发版现场复验：web 2.0 jar 下点号 env 不生效、服务静默连默认红库）。
        # other.sql.* 点号 env 保留仅作兼容性备份。2026-11-02 IT-036 对齐 para-server 双通道模式。
        - name: DB_HOST
          value: 172.20.222.3:1521
        - name: DB_NAME
          value: AFCITPDB
        - name: DB_USERNAME
          value: qditp

        - name: DB_PASSWORD

          value: qditp
        # JVM 堆 = max_memory - reserved_memory - max_direct_memory（基础镜像 startapp.sh，见 docs/tracking/IT-020）
        - name: max_memory
          value: '2000'
        - name: reserved_memory
          value: '500'
        - name: max_direct_memory
          value: '100'
        - name: MY_POD_UUID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: security.index
          value: '01'
        - name: logging.file.path
          value: logs/acc-security
        - name: security.connectOutTime
          value: '3000'
        - name: other.web.enableLogRequestInFilter
          value: 'true'
        - name: other.web.enableBodyCacheFilter
          value: 'true'
        - name: thread.socketNamePrefix
          value: socket-connect
        - name: itp.tacKeyIdex
          value: '195'
        - name: itp.dpkIdex
          value: '178'
        - name: security.publicKey
          value: 797BBE15308FC3C6A2AE8EC65337CDD0665DBDFEE3BE0671F42045F93B91C6DB05653512F22817B1E9277375AB0A2D65A752475DC1963E6F71D85E56E3C58161
        - name: server.undertow.worker-threads
          value: '10'
        - name: security.secondPort
          value: '7002'
        - name: knife4j.production
          value: 'false'
        - name: security.firstPort
          value: '6666'
        - name: SERVER_PORT
          value: '8080'
        - name: other.web.enableLogTakeTimesInInterceptor
          value: 'true'
        - name: logging.level.root
          value: info
        - name: thread.maxPoolSize
          value: '10'
        - name: security.readOutTime
          value: '3000'
        - name: thread.corePoolSize
          value: '10'
        - name: itp.kekIdex
          value: '2'
        - name: spring.application.name
          value: acc-security
        - name: logging.level.com.chinasofti
          value: debug
        - name: itp.signKey
          value: bc4f7c96259acf9946094fa
        - name: security.firstIp
          value: 172.20.201.4
        - name: other.web.unSafeUrlChars
          value: 'null'
        - name: security.privateKey
          value: 224525589868531772E03470B5187F242C4D54994A52EEA2E9F6ACC0DD0043D9
        - name: server.undertow.io-threads
          value: '10'
        - name: thread.queueCapacity
          value: '99999'
        - name: itp.mac1KeyIdex
          value: '192'
        - name: itp.mac2KeyIdex
          value: '193'
        - name: SERVICE_NAME
          value: security-server
        - name: NAMESPACE
          value: itp
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        image: os-harbor-svc.default.svc.cloudos:443/itp/acc-security-server:2.0.20
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: security-server
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /monitor/health
            port: 8080
            scheme: HTTP
          # P2-9（2026-11-02）：readiness 进基线，消除「Spring 卡 refresh / 8080 未监听 → Pod 假 Ready」观测盲区（IT-036）。
          # 仅 readiness 不配 liveness（liveness 会重启 Pod，高危）；initialDelay 60s 覆盖慢启动，failureThreshold×period=60s 兜底。
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /home/javaapp/app/logs/
          name: hostpath-bky1e5tz0
      volumes:
      - hostPath:
          path: /home/app/logs/security-server
          type: ''
        name: hostpath-bky1e5tz0
