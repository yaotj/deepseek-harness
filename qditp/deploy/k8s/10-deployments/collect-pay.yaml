apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: collect-pay
  name: collect-pay
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collect-pay
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: collect-pay
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        # DB_* 下划线命名：Spring Boot relaxed binding 对 dot-name env var（如 other.sql.host）识别不稳定
        # （2026-10-14 实测 + 2026-11-02 发版现场复验：web 2.0 jar 下点号 env 不生效、服务静默连默认红库）。
        # other.sql.* 点号 env 保留仅作兼容性备份。2026-11-02 IT-036 对齐 para-server 双通道模式。
        - name: DB_HOST
          value: 172.20.222.3:1521
        - name: DB_NAME
          value: AFCITPDB
        - name: DB_USERNAME
          value: qditp

        - name: DB_PASSWORD

          value: qditp
        # JVM 堆 = max_memory - reserved_memory - max_direct_memory（基础镜像 startapp.sh，见 docs/tracking/IT-020）
        - name: max_memory
          value: '4000'
        - name: reserved_memory
          value: '1000'
        - name: max_direct_memory
          value: '100'
        - name: MY_POD_UUID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        - name: management.tracing.enabled
          value: 'true'
        - name: pay.center.app-refund-notice-url
          value: http://58.56.166.170:48000/fep-app/ci/app/receiveRefundResult
        - name: app.charset
          value: UTF-8
        - name: jhm.key
          value: fedf5g#@$(*&d390y3hcn
        - name: pay.center.notice-app-taketicketresult-url
          value: https://dtcustomer.bestonepay.com/testngbackV2/ci/app/v2/receiveTakeTicketResult
        - name: other.sql.double-datasource
          value: 'false'
        - name: other.web.enableBodyCacheFilter
          value: 'true'
        - name: other.web.enableLogRequestInFilter
          value: 'true'
        - name: pay.center.gateway-url
          value: https://pay-gateway.example.com/api
        - name: pay.center.pay-center-query-url
          value: http://dtcustomer.bestonepay.com/ngpayment-gateway/api/v1/payment/payQuery
        - name: pay.center.merchant-no
          value: JOPJ490HLK9Z
        - name: pay.center.notice-app-refundresult-url
          value: https://dtcustomer.bestonepay.com/testngbackV2/ci/app/v2/receiveRefundResult
        - name: pay.center.charset
          value: UTF-8
        - name: pay.center.sign-type
          value: RSA
        - name: server.tomcat.basedir
          value: /Users/zhoucong/logs
        - name: app.retryTimes
          value: '5'
        - name: mybatis.mapper-locations
          value: classpath:mapper/*Mapper.xml
        - name: doTime.noticeTakeTicketFailureTask
          value: 0 */4 * * * ?
        - name: pay.center.api-version
          value: '1.0'
        - name: service.ticket.url
          value: http://172.20.211.23:30014
        - name: doTime.noticeRefundTask
          value: 0 */3 * * * ?
        - name: SERVER_PORT
          value: '8080'
        - name: other.sql.username
          value: qditp
        - name: other.web.enableLogTakeTimesInInterceptor
          value: 'true'
        - name: service.account.url
          value: http://172.20.211.23:30013
        - name: other.sql.host
          value: 172.20.222.3:1521
        - name: app.signType
          value: '00'
        - name: pay.center.pay-center-refund-url
          value: http://dtcustomer.bestonepay.com/ngpayment-gateway/api/v1/refund/requestRefund
        - name: pay.center.pay-center-pay-url
          value: http://dtcustomer.bestonepay.com/ngpayment-gateway/api/v1/payment/requestPay
        - name: app.format
          value: json
        - name: spring.application.name
          value: collect-pay
        - name: doTime.noticeTakeTicketTask
          value: 0 */2 * * * ?
        - name: pay.center.refundReason
          value: \u51FA\u7968\u6570\u91CF\u4E0D\u8DB3
        # pay.center.callback-url 已从 env 移除：原值 http://localhost:9098/... 是死回调（IT-035 §5，2026-11-02 清除）；
        # yml 默认现为空串（= 不下发 notifyUrl）。恢复 collect-pay 业务时按公网入口 58.56.166.170:48000/... 回填，见 collect-pay-server application.yml 该键注释。
        - name: bom.payTimeOut
          value: '180'
        - name: pay.center.notice-app-taketicketfailureresult-url
          value: https://dtcustomer.bestonepay.com/testngbackV2/ci/app/v2/receiveTakeTicketFaultResult
        - name: other.sql.page.type
          value: oracle
        - name: app.signKey
          value: null
        - name: other.web.unSafeUrlChars
          value: 'null'
        - name: other.sql.password
          value: qditp
        - name: other.sql.database
          value: AFCITPDB
        - name: other.sql.type
          value: oracle
        - name: bom.payTimeInterval
          value: '3'
        - name: sign.algorithm
          value: SHA256WithRSA
        - name: app.providerId
          value: '06'
        - name: SERVICE_NAME
          value: collect-pay
        - name: NAMESPACE
          value: itp
        - name: RECON_INTERNAL_TOKEN
          value: e72bc1ece71af5ae9db420944a3b24ab8de5056681c58106488c635c43328306
        - name: SERVICE_RECON_URL
          value: http://recon-server-bjzdy-svc.itp.svc:30034
        image: os-harbor-svc.default.svc.cloudos:443/itp/collect-pay-server:1.1.92
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: collect-pay
        readinessProbe:
          failureThreshold: 6
          # P2-9（2026-11-02）：collect-pay 的 /monitor/health 被 URL 安全过滤器恒返 403（IT-035 §三），HTTP 探针会永不 Ready；
          # 退用 tcpSocket——「未监听=NotReady」这一核心判据仍成立。
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 8080
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-gzexys9l0
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-gzexys9l0
