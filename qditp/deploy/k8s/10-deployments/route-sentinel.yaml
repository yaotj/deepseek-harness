apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: route-sentinel
  name: route-sentinel
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: route-sentinel
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: route-sentinel
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        # JVM 堆 = max_memory - reserved_memory - max_direct_memory（基础镜像 startapp.sh，见 docs/tracking/IT-020）
        - name: max_memory
          value: '2000'
        - name: reserved_memory
          value: '500'
        - name: max_direct_memory
          value: '100'
        - name: MY_POD_UUID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: spring.application.name
          value: route-sentinel
        - name: SERVER_PORT
          value: '8080'
        - name: spring.datasource.url
          value: jdbc:oracle:thin:@//172.20.222.3:1521/AFCITPDB
        - name: spring.datasource.username
          value: qditp
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: itp-secrets
        - name: management.endpoints.web.exposure.include
          value: gatewayroutes,health,info,metrics,routecache
        - name: management.endpoint.health.probes.enabled
          value: 'true'
        # vl logs 服务（VictoriaLogs）端点，与 itp 命名空间其他服务一致。
        # 由 route-sentinel 自带的 logback VictoriaLogsAppender（org.qd.scg.log，1.0.2 起）消费：
        #   env 为空则 appender 自动禁用（不起线程、不丢日志）；1.0.1 无此 appender、此 env 不生效。
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        image: os-harbor-svc.default.svc.cloudos:443/itp/route-sentinel:1.0.1
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: route-sentinel
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-localtime
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-localtime
