apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: alipay-pay-sign-server
  name: alipay-pay-sign-server
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alipay-pay-sign-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: alipay-pay-sign-server
    spec:
      containers:
      - env:
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        - name: service.blacklist.openLogger
          value: 'true'
        - name: service.key.openLogger
          value: 'true'
        - name: other.sql.double-datasource
          value: 'false'
        - name: other.web.enableLogRequestInFilter
          value: 'true'
        - name: other.web.enableBodyCacheFilter
          value: 'true'
        - name: pay.center.merchant-private-key
          valueFrom:
            secretKeyRef:
              name: itp-secrets
              key: pay.center.merchant-private-key
        - name: pay.center.gateway-url
          value: https://dtcustomer.bestonepay.com/ngopenplatform/api/payment/requestRefund
        - name: pay.center.merchant-no
          value: UIQ2N4F0Q2
        - name: alipay.external.blacklist-url
          value: https://dtcustomer.bestonepay.com/ngopenplatform/notify/receiveCardDataFromItp
        - name: pay.center.close-result-notify-url
          value: https://dtcustomer.bestonepay.com/ngopenplatform/notify/closeResultForAlipay
        - name: pay.center.sign-type
          value: RSA
        - name: pay.center.charset
          value: UTF-8
        - name: mybatis.mapper-locations
          value: classpath*:mapper/*.xml
        - name: knife4j.production
          value: 'false'
        - name: service.para.openLogger
          value: 'true'
        - name: mybatis.configuration.jdbc-type-for-null
          value: VARCHAR
        - name: pay.center.api-version
          value: '1.0'
        - name: service.ticket.url
          value: http://172.20.211.23:30014
        - name: industry.issue-channel-code
          value: '07'
        - name: pay.center.blacklist-notify-url
          value: https://dtcustomer.bestonepay.com/ngopenplatform/notify/receiveBlackListFromItp
        - name: server.port
          value: '8080'
        - name: service.security.openLogger
          value: 'true'
        - name: other.sql.username
          value: qditp
        - name: service.ticket.openLogger
          value: 'true'
        - name: other.web.enableLogTakeTimesInInterceptor
          value: 'true'
        - name: service.account.url
          value: http://172.20.211.23:30021
        - name: other.sql.host
          value: 172.20.222.3
        - name: service.security.url
          value: http://127.0.0.1:9012
        - name: pay.center.gatewayUrl
          value: https://dtcustomer.bestonepay.com/ngopenplatform/api/payment/requestRefund
        - name: spring.application.name
          value: alipay-pay-sign
        - name: service.industryData.openLogger
          value: 'true'
        - name: pay.center.request-refund-url
          value: https://dtcustomer.bestonepay.com/ngopenplatform/api/payment/requestRefund
        - name: service.key.url
          value: http://127.0.0.1:9103
        - name: pay.center.callback-url
          value: http://58.56.166.170:48000/fep-alipay/notify/payment/payNotify
        - name: service.para.url
          value: http://172.20.211.23:30026
        - name: service.blacklist.url
          value: http://172.20.211.23:30017
        - name: service.industryData.url
          value: http://172.20.211.23:30018
        - name: other.sql.page.type
          value: oracle
        - name: other.web.unSafeUrlChars
          value: 'null'
        - name: other.sql.password
          valueFrom:
            secretKeyRef:
              name: itp-secrets
              key: other.sql.password
        - name: other.sql.database
          value: AFCITPDB
        - name: service.account.openLogger
          value: 'true'
        - name: other.sql.type
          value: oracle
        - name: pay.center.paycenter-public-key
          valueFrom:
            secretKeyRef:
              name: itp-secrets
              key: pay.center.paycenter-public-key
        - name: SERVICE_NAME
          value: alipay-pay-sign-server
        - name: NAMESPACE
          value: itp
        - name: pay.center.refund-notify-url
          value: http://58.56.166.170:48000/fep-alipay/api/payment/refundNotify
        image: os-harbor-svc.default.svc.cloudos:443/itp/alipay-pay-sign:1.1.56
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: alipay-pay-sign-server
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-jpzqbbg60
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-jpzqbbg60
