apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: recon-server
  name: recon-server
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recon-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: recon-server
    spec:
      containers:
      - env:
        - name: SERVER_PORT
          value: '9112'
        - name: RECON_FTP_REMOTE_ROOT
          value: /itp/recon
        - name: RECON_FTP_HOST
          value: 172.20.215.3
        - name: DB_NAME
          value: AFCITPDB
        - name: RECON_FTP_ENABLED
          value: 'true'
        - name: RECON_SRC_DAILY_TICKET_URL
          value: http://daily-ticket-server-rdbe5-svc.itp.svc:30027
        - name: DB_HOST
          value: 172.20.222.3:1521
        - name: RECON_STORAGE_ROOT
          value: /home/javaapp/app/recon
        - name: DB_USERNAME
          value: qditp
        - name: RECON_SRC_GATE_TXN_PAY_URL
          value: http://gate-txn-pay-server-jomf4-svc.itp.svc:30019
        - name: RECON_SRC_COLLECT_PAY_URL
          value: http://collect-pay-c23ku-svc.itp.svc:30024
        - name: RECON_FTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itp-secrets
              key: RECON_FTP_PASSWORD
        - name: RECON_FTP_PORT
          value: '21'
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        - name: RECON_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: itp-secrets
              key: RECON_INTERNAL_TOKEN
        - name: RECON_FTP_USERNAME
          value: ftpuser
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itp-secrets
              key: DB_PASSWORD
        - name: SERVICE_NAME
          value: recon-server
        - name: NAMESPACE
          value: itp
        image: os-harbor-svc.default.svc.cloudos:443/itp/recon-server:1.0.17
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: recon-server
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-bu7f0oin0
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-bu7f0oin0
