apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: recon-server
  name: recon-server
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recon-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: recon-server
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        # JVM 堆 = max_memory - reserved_memory - max_direct_memory（基础镜像 startapp.sh，见 docs/tracking/IT-020）
        - name: max_memory
          value: '4000'
        - name: reserved_memory
          value: '1000'
        - name: max_direct_memory
          value: '100'
        - name: MY_POD_UUID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: SERVER_PORT
          value: '8080'
        - name: RECON_FTP_REMOTE_ROOT
          value: /itp/recon
        - name: RECON_FTP_HOST
          value: 172.20.215.3
        - name: DB_NAME
          value: AFCITPDB
        - name: RECON_FTP_ENABLED
          value: 'true'
        - name: RECON_SRC_DAILY_TICKET_URL
          value: http://daily-ticket-server-rdbe5-svc.itp.svc:30027
        - name: DB_HOST
          value: 172.20.222.3:1521
        - name: RECON_STORAGE_ROOT
          value: /home/javaapp/app/recon
        - name: DB_USERNAME
          value: qditp
        - name: RECON_SRC_GATE_TXN_PAY_URL
          value: http://gate-txn-pay-server-jomf4-svc.itp.svc:30019
        - name: RECON_FTP_PASSWORD
          value: ftp@ITP
        - name: RECON_FTP_PORT
          value: '21'
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        - name: RECON_INTERNAL_TOKEN
          value: <from-secret>
        - name: RECON_FTP_USERNAME
          value: ftpuser
        - name: DB_PASSWORD
          value: qditp
        - name: SERVICE_NAME
          value: recon-server
        - name: NAMESPACE
          value: itp
        image: os-harbor-svc.default.svc.cloudos:443/itp/recon-server:1.0.30
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: recon-server
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /monitor/health
            port: 8080
            scheme: HTTP
          # P2-9（2026-11-02）：readiness 进基线，消除「Spring 卡 refresh / 8080 未监听 → Pod 假 Ready」观测盲区（IT-036）。
          # 仅 readiness 不配 liveness（liveness 会重启 Pod，高危）；initialDelay 60s 覆盖慢启动，failureThreshold×period=60s 兜底。
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-bu7f0oin0
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-bu7f0oin0
