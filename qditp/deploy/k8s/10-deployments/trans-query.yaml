apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: trans-query
  name: trans-query
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trans-query
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: trans-query
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        # DB_* 下划线命名：Spring Boot relaxed binding 对 dot-name env var（如 other.sql.host）识别不稳定
        # （2026-10-14 实测 + 2026-11-02 发版现场复验：web 2.0 jar 下点号 env 不生效、服务静默连默认红库）。
        # other.sql.* 点号 env 保留仅作兼容性备份。2026-11-02 IT-036 对齐 para-server 双通道模式。
        - name: DB_HOST
          value: 172.20.222.3:1521
        - name: DB_NAME
          value: AFCITPDB
        - name: DB_USERNAME
          value: qditp

        - name: DB_PASSWORD

          value: qditp
        # JVM 堆 = max_memory - reserved_memory - max_direct_memory（基础镜像 startapp.sh，见 docs/tracking/IT-020）
        - name: max_memory
          value: '4000'
        - name: reserved_memory
          value: '1000'
        - name: max_direct_memory
          value: '100'
        - name: MY_POD_UUID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        - name: management.tracing.enabled
          value: 'true'
        - name: management.tracing.sampling.probability
          value: '0'
        - name: spring.autoconfigure.exclude
          value: org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
        - name: SERVER_PORT
          value: '8080'
        - name: SERVICE_PAY_SIGN_URL
          value: http://pay-sign-server-hsa9w-svc.itp.svc:8080
        - name: APP_TRANS_NEW_ATTRIBUTABLE_PARTY
          value: cjdsj
        - name: SERVICE_GATE_TXN_PAY_OPEN_LOGGER
          value: 'true'
        - name: SERVICE_PAY_SIGN_OPEN_LOGGER
          value: 'true'
        - name: SERVICE_PARA_URL
          value: http://para-server-pufrl-svc.itp.svc:30026
        - name: APP_TRANS_NEW_RECEIVING_PARTY
          value: qddt
        - name: APP_TRANS_MERCHANT_CHANGE_DATE
          value: '20260901'
        - name: APP_TRANS_OLD_RECEIVING_PARTY
          value: qddt
        - name: OTHER_WEB_ENABLE_LOG_REQUEST_IN_FILTER
          value: 'true'
        - name: SERVICE_PARA_OPEN_LOGGER
          value: 'true'
        - name: SPRING_APPLICATION_NAME
          value: trans-query-server
        - name: SERVICE_GATE_TXN_PAY_URL
          value: http://gate-txn-pay-server-jomf4-svc.itp.svc:30019
        - name: OTHER_WEB_ENABLE_LOG_TAKE_TIMES_IN_INTERCEPTOR
          value: 'true'
        - name: OTHER_WEB_UNSAFEURLCHARS
          value: 'null'
        - name: OTHER_WEB_ENABLE_BODY_CACHE_FILTER
          value: 'true'
        - name: APP_TRANS_OLD_ATTRIBUTABLE_PARTY
          value: cjdsj
        - name: SERVICE_NAME
          value: trans-query
        - name: NAMESPACE
          value: itp
        image: os-harbor-svc.default.svc.cloudos:443/itp/trans-query:1.0.23
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: trans-query
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /monitor/health
            port: 8080
            scheme: HTTP
          # P2-9（2026-11-02）：readiness 进基线，消除「Spring 卡 refresh / 8080 未监听 → Pod 假 Ready」观测盲区（IT-036）。
          # 仅 readiness 不配 liveness（liveness 会重启 Pod，高危）；initialDelay 60s 覆盖慢启动，failureThreshold×period=60s 兜底。
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-rxmnjped0
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-rxmnjped0
