apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: face-pay-server
  name: face-pay-server
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: face-pay-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: face-pay-server
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        # JVM 堆 = max_memory - reserved_memory - max_direct_memory（基础镜像 startapp.sh，见 docs/tracking/IT-020）
        - name: max_memory
          value: '4000'
        - name: reserved_memory
          value: '1000'
        - name: max_direct_memory
          value: '100'
        - name: MY_POD_UUID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        - name: management.tracing.enabled
          value: 'true'
        - name: management.tracing.sampling.probability
          value: '0'
        - name: spring.autoconfigure.exclude
          value: org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
        - name: PAY_CENTER_SUPPLEMENT_NOTICE_URL
          value: http://58.56.166.170:48000/itpbom/ci/bom/supplementPayNotice
        - name: DB_HOST
          value: 172.20.222.3:1521
        - name: DB_DATABASE
          value: AFCITPDB
        # DB_NAME MUST 与 DB_DATABASE 同值同注：application.yml 读的是 ${DB_NAME:hditpdb}（默认红岛），
        # 不注则连红岛 ORA-12514（2026-11-02 现场实证）。2026-11-02 IT-036 对齐双通道模式。
        - name: DB_NAME
          value: AFCITPDB
        - name: DB_USERNAME
          value: qditp
        # 明文即真源（docs/ops/environments/跨环境共性.md §三）；itp-secrets 不存在，secretKeyRef 致 CreateContainerConfigError
        - name: DB_PASSWORD
          value: qditp
        - name: PAY_CENTER_MERCHANT_NO
          value: JOPJ490HLK9Z
        - name: JHM_KEY
          value: fedf5g#@$(*&d390y3hcn
        - name: PAY_CENTER_PAY_URL
          value: http://dtcustomer.bestonepay.com/ngpayment-gateway/api/v1/payment/requestPay
        - name: PAY_CENTER_QUERY_URL
          value: http://dtcustomer.bestonepay.com/ngpayment-gateway/api/v1/payment/payQuery
        - name: PAY_CENTER_REFUND_URL
          value: http://dtcustomer.bestonepay.com/ngpayment-gateway/api/v1/refund/requestRefund
        - name: PAY_CENTER_REFUND_QUERY_URL
          value: http://dtcustomer.bestonepay.com/ngpayment-gateway/api/v1/refund/refundQuery
        - name: PAY_CENTER_CHECKOUT_COUNTER_URL
          value: http://dtcustomer.bestonepay.com/ngpayment-gateway/api/v1/checkoutCounter
        - name: PAY_CENTER_PAY_NOTICE_URL
          value: http://58.56.166.170:48000/itptvm/ci/tvm/payNotice
        - name: NOTIFY_APP_TAKE_TICKET_RESULT_URL
          value: https://dtcustomer.bestonepay.com/testngbackV2/ci/app/v2/receiveTakeTicketResult
        - name: NOTIFY_APP_TAKE_TICKET_FAULT_RESULT_URL
          value: https://dtcustomer.bestonepay.com/testngbackV2/ci/app/v2/receiveTakeTicketFaultResult
        - name: NOTIFY_APP_REFUND_RESULT_URL
          value: https://dtcustomer.bestonepay.com/testngbackV2/ci/app/v2/receiveRefundResult
        - name: SERVICE_TICKET_URL
          value: http://ticket-server-bsyju-svc.itp.svc:9100
        - name: SERVICE_ACCOUNT_URL
          value: http://account-n4ba6-svc.itp.svc:9098
        - name: SERVICE_NAME
          value: face-pay-server
        - name: NAMESPACE
          value: itp
        - name: NOTIFY_APP_REFUND_NOTICE_URL
          value: http://58.56.166.170:48000/fep-app/ci/app/receiveRefundResult
        - name: NOTIFY_APP_PAY_RESULT_URL
          value: https://dtcustomer.bestonepay.com/testngbackV2/ci/app/v2/receivePaymentResult
        - name: PAY_CENTER_REFUND_NOTICE_URL
          value: http://58.56.166.170:48000/itpbom/ci/bom/receiveRefundResult
        image: os-harbor-svc.default.svc.cloudos:443/itp/face-pay-server:1.0.89
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: face-pay-server
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /monitor/health
            port: 8080
            scheme: HTTP
          # P2-9（2026-11-02）：readiness 进基线，消除「Spring 卡 refresh / 8080 未监听 → Pod 假 Ready」观测盲区（IT-036）。
          # 仅 readiness 不配 liveness（liveness 会重启 Pod，高危）；initialDelay 60s 覆盖慢启动，failureThreshold×period=60s 兜底。
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-nk8ct6520
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-nk8ct6520
