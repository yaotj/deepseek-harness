apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: fep-acc
  name: fep-acc
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fep-acc
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fep-acc
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        # JVM 堆 = max_memory - reserved_memory - max_direct_memory（基础镜像 startapp.sh，见 docs/tracking/IT-020）
        - name: max_memory
          value: '2000'
        - name: reserved_memory
          value: '500'
        - name: max_direct_memory
          value: '100'
        - name: MY_POD_UUID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: management.tracing.enabled
          value: 'true'
        - name: management.tracing.sampling.probability
          value: '0'
        - name: spring.autoconfigure.exclude
          value: org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
        - name: other.web.unSafeUrlChars
          value: 'null'
        - name: knife4j.production
          value: 'false'
        - name: spring.application.name
          value: fep-acc-server
        - name: service.account.openLogger
          value: 'true'
        - name: other.web.enableLogRequestInFilter
          value: 'true'
        - name: other.web.enableBodyCacheFilter
          value: 'true'
        - name: SERVER_PORT
          value: '9110'
        - name: other.web.enableLogTakeTimesInInterceptor
          value: 'true'
        - name: service.account.url
          value: http://172.20.211.23:30013
        - name: SERVICE_NAME
          value: fep-acc
        - name: NAMESPACE
          value: itp
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        image: os-harbor-svc.default.svc.cloudos:443/itp/fep-acc:1.0.10
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: fep-acc
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-o3vwrc4k0
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-o3vwrc4k0
