apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    security: 'true'
  labels:
    app: ticket-server
  name: ticket-server
  namespace: itp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ticket-server
    spec:
      containers:
      - env:
        - name: app.notify.counting-ticket-times-url
          value: https://dtcustomer.bestonepay.com/testngbackV2/ci/app/v2/receiveCountingTicketTimes
        - name: app.notify.counting-ticket-times-enabled
          value: 'true'
        - name: app.notify.alipay-industry-data-url
          value: https://dtcustomer.bestonepay.com/ngopenplatform/notify/receiveCardDataFromItp
        - name: app.trans.old-attributable-party
          value: cjdsj
        - name: ticket.default-code-status
          value: '03'
        - name: ticket.default-last-txn-station
          value: FFFF
        - name: service.alipayAccount.url
          value: http://172.20.211.23:30021
        - name: other.web.enableLogRequestInFilter
          value: 'true'
        - name: other.web.enableBodyCacheFilter
          value: 'true'
        - name: other.sql.double-datasource
          value: 'false'
        - name: app.trans.new-receiving-party
          value: qddt
        - name: app.notify.industry-data-enabled
          value: 'true'
        - name: service.fepDev.url
          value: http://172.20.211.23:30009
        - name: service.fepDev.openLogger
          value: 'true'
        - name: mybatis.mapper-locations
          value: classpath*:mapper/*.xml
        - name: knife4j.production
          value: 'false'
        - name: industry.issue-channel-code
          value: '01'
        - name: service.dailyTicket.url
          value: http://172.20.211.23:30027
        - name: server.port
          value: '9100'
        - name: service.security.openLogger
          value: 'true'
        - name: industry.ticket-type
          value: '0441'
        - name: other.sql.username
          value: qditp
        - name: app.trans.new-attributable-party
          value: qddt
        - name: other.web.enableLogTakeTimesInInterceptor
          value: 'true'
        - name: app.trans.merchant-change-date
          value: '20260901'
        - name: VLOGS_URL
          value: http://victoria-logs-pbi6a-svc.itp.svc:30032
        - name: other.sql.host
          value: 172.20.222.3:1521
        - name: service.security.url
          value: http://172.20.211.23:30012
        - name: service.paySign.url
          value: http://172.20.211.23:30016
        - name: service.dailyTicket.openLogger
          value: 'true'
        - name: spring.application.name
          value: ticket-server
        - name: service.industryData.openLogger
          value: 'true'
        - name: app.notify.alipay-push-trans-data-url
          value: https://dtcustomer.bestonepay.com/ngopenplatform/notify/pushTransData
        - name: ticket.default-channel
          value: '01'
        - name: service.gateTxnPay.url
          value: http://172.20.211.23:30019
        - name: service.para.url
          value: http://172.20.211.23:30026
        - name: ticket.default-gate-in-station
          value: FFFF
        - name: service.industryData.url
          value: http://172.20.211.23:30018
        - name: other.web.unSafeUrlChars
          value: 'null'
        - name: other.sql.page.type
          value: oracle
        - name: service.gateTxnPay.openLogger
          value: 'true'
        - name: other.sql.password
          valueFrom:
            secretKeyRef:
              name: itp-secrets
              key: other.sql.password
        - name: app.notify.industry-data-url
          value: https://dtcustomer.bestonepay.com/testngbackV2/ci/app/v2/receiveCardDataFromItp
        - name: other.sql.database
          value: AFCITPDB
        - name: industry.timestamp-expire-hours
          value: '4'
        - name: other.sql.type
          value: oracle
        - name: ticket.default-gate-status
          value: '0000'
        - name: app.trans.old-receiving-party
          value: cjdsj
        - name: SERVICE_NAME
          value: ticket-server
        - name: NAMESPACE
          value: itp
        image: os-harbor-svc.default.svc.cloudos:443/itp/ticket-server:2.1.103
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        name: ticket-server
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: '1'
            memory: 2Gi
        securityContext:
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /etc/localtime
          name: hostpath-7w1p6nit0
      volumes:
      - hostPath:
          path: /etc/localtime
          type: ''
        name: hostpath-7w1p6nit0
