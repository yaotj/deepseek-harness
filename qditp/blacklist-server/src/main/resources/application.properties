spring.threads.virtual.enabled=false
server.port=8080
spring.application.name=blacklist

other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true

knife4j.production=false
management.tracing.enabled=true
management.tracing.sampling.probability=0
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
other.sql.host=${DB_HOST:172.110.110.21:1521}
other.sql.double-datasource=false
other.sql.type=oracle
other.sql.page.type=oracle
other.sql.database=${DB_NAME:pdbplatdb}
other.sql.username=${DB_USERNAME:platdb}
other.sql.password=${DB_PASSWORD:platdb}

mybatis.mapper-locations=classpath*:mapper/*.xml

app.notify.blacklist-url=${APP_NOTIFY_BLACKLIST_URL:http://fep-app-server:8080/app/receiveBlackListFromItp}

service.alipay-pay-sign.url=${SERVICE_ALIPAY_PAY_SIGN_URL:http://alipay-pay-sign-server-t3o7n-svc.itp.svc:30022}
service.alipay-pay-sign.openLogger=true

service.gateTxnPay.url=${SERVICE_GATE_TXN_PAY_URL:http://gate-txn-pay-server-jomf4-svc.itp.svc:30019}
service.gateTxnPay.openLogger=true

blacklist.inspect.batch-size=200

# HCE 黑名单文件生成上传（POST /internal/blacklist/hce-file/generate，由 sys_job 335 驱动）
# ACC FTP 四要素 MUST 用环境变量注入真实值，仓库里不落真实口令；host 留空时只生成本地文件不上传
blacklist.hce-file.ftp-host=${ACC_FTP_HOST:}
blacklist.hce-file.ftp-port=${ACC_FTP_PORT:21}
blacklist.hce-file.ftp-username=${ACC_FTP_USERNAME:}
blacklist.hce-file.ftp-password=${ACC_FTP_PASSWORD:}
blacklist.hce-file.ftp-remote-dir=${ACC_FTP_REMOTE_DIR:/itp/prm/}
blacklist.hce-file.local-dir=${HCE_BLACKLIST_LOCAL_DIR:/tmp/hce-blacklist}
blacklist.hce-file.file-prefix=PRM.0013.9700.
blacklist.hce-file.param-type=0013
