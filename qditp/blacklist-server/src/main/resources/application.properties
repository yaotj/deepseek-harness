server.port=9102
spring.application.name=blacklist

other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true

knife4j.production=false

other.sql.host=${DB_HOST:127.0.0.1:1521}
other.sql.double-datasource=false
other.sql.type=oracle
other.sql.page.type=oracle
other.sql.database=${DB_NAME:orcl}
other.sql.username=${DB_USERNAME:}
other.sql.password=${DB_PASSWORD:}

mybatis.mapper-locations=classpath*:mapper/*.xml

app.notify.blacklist-url=${APP_NOTIFY_BLACKLIST_URL:http://fep-app-server:8080/app/receiveBlackListFromItp}

# 服务间调用地址一律用集群内网 Service 名。NEVER 删键：键缺失时 rpc 退化成默认服务名 `*-service`、DNS 解析不到。
service.alipay-pay-sign.url=${SERVICE_ALIPAY_PAY_SIGN_URL:http://alipay-pay-sign-server-t3o7n-svc.itp.svc:30022}
service.alipay-pay-sign.openLogger=true

service.gateTxnPay.url=${SERVICE_GATE_TXN_PAY_URL:http://gate-txn-pay-server-jomf4-svc.itp.svc:30019}
service.gateTxnPay.openLogger=true

blacklist.inspect.batch-size=200
