server.port=9103
spring.application.name=ticket-server

other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true

knife4j.production=false

mybatis.mapper-locations=classpath*:mapper/*.xml

ticket.default-channel=01
ticket.default-code-status=03
ticket.default-gate-status=00
ticket.default-last-txn-station=FFFF
ticket.default-gate-in-station=FFFF

# 服务间调用地址：默认值一律用集群内网 Service 名（`kubectl get svc -n itp` 实测，2026-09-11），
# 取代原先的 `172.20.211.23:30xxx` NodePort 写法——NodePort 号极易与别的服务串号（下面三条就是实例）。
# NEVER 删键：键缺失时 rpc 退化成默认服务名 `*-service`、DNS 解析不到。
service.security.url=${SERVICE_SECURITY_URL:http://security-server-8h3eo-svc.itp.svc:8080}
service.security.openLogger=true

service.industryData.url=${SERVICE_INDUSTRY_DATA_URL:http://industry-data-server-6dv5u-svc.itp.svc:30018}
service.industryData.openLogger=true

service.account.url=${SERVICE_ACCOUNT_URL:http://account-n4ba6-svc.itp.svc:9098}
service.account.openLogger=true

# 原值 172.20.211.23:30015 是 **key-server** 的 NodePort，不是支付宝开户服务（后者是 30021）。
service.alipayAccount.url=${SERVICE_ALIPAY_ACCOUNT_URL:http://alipay-account-server-2n6kc-svc.itp.svc:30021}
service.alipayAccount.openLogger=true

service.para.url=${SERVICE_PARA_URL:http://para-server-pufrl-svc.itp.svc:30026}
service.para.openLogger=true

# 2026-09-14（ADR-D63）删除 service.fepDev.url / service.fepDev.openLogger：
# 补站两条链路（IF5A-03 / IF8A-04）原本 RPC 打 fep-dev-server 的 /ci/agm/notiVerifyResult，
# 而那个端点自 ADR-D62 起只剩「itpUserId 归一 + 原样转回本服务」——即 ticket-server ⇄ fep-dev
# 的双向 RPC 环。现已改为进程内直调 gate.GateTicketHandler，本服务对 fep-dev 零出向。
# 原默认值（供回滚参考）：http://fep-dev-server-748lq-svc.itp.svc:30009
# NEVER 因为「fep-dev 还在调我」就把键加回来 —— 那是入向，入向不需要 service.*.url。

# 原值 172.20.211.23:9106 把容器端口当成了 NodePort，该组合在集群外不存在。
service.gateTxnPay.url=${SERVICE_GATE_TXN_PAY_URL:http://gate-txn-pay-server-jomf4-svc.itp.svc:30019}
service.gateTxnPay.openLogger=true

service.dailyTicket.url=${SERVICE_DAILY_TICKET_URL:http://daily-ticket-server-rdbe5-svc.itp.svc:30027}
service.dailyTicket.openLogger=true

# 2026-09-11 补齐：此键此前整条缺失，运行时落到 rpc 默认服务名 `pay-sign-service`、DNS 解析不到。
service.paySign.url=${SERVICE_PAY_SIGN_URL:http://pay-sign-server-hsa9w-svc.itp.svc:8080}
service.paySign.openLogger=true

# 商户号变更配置：变更日期前使用城交商户，变更日期后使用新商户
app.trans.merchant-change-date=20260901
app.trans.old-attributable-party=cjdsj
app.trans.old-receiving-party=qddt
app.trans.new-attributable-party=cjdsj
app.trans.new-receiving-party=qddt

app.notify.industry-data-url=https://dtcustomer.bestonepay.com/testngbackV2/ci/app/v2/receiveCardDataFromItp
app.notify.industry-data-enabled=true
app.notify.alipay-industry-data-url=https://dtcustomer.bestonepay.com/ngopenplatform/notify/receiveCardDataFromItp
app.notify.alipay-push-trans-data-url=https://dtcustomer.bestonepay.com/ngopenplatform/notify/pushTransData
app.notify.provider-id=01
app.notify.charset=UTF-8
app.notify.format=json
app.notify.sign-type=00
app.notify.sign=

industry.issue-channel-code=01
industry.ticket-type=0441
industry.timestamp-expire-hours=4

# 支付宝出行的卡机构编号，出站扣费 industryDetail.cardIssueCode 取此值
alipay.trip.card-issue-code=0007

# 数据库地址：原有两行注释是非 UTF-8 遗留乱码（`#?????? ???IP`），已按实际含义重写。
other.sql.host=${DB_HOST:172.20.222.3:1521}
other.sql.double-datasource=false
other.sql.type=oracle
other.sql.page.type=oracle
other.sql.database=${DB_NAME:AFCITPDB}
other.sql.username=${DB_USERNAME:qditp}
other.sql.password=${DB_PASSWORD:qditp}

# 日终对账分片导出（来源标识 ticket，负责 EXP 与 BUS 两类文件）
service.recon.url=${SERVICE_RECON_URL:http://recon-server-bjzdy-svc.itp.svc:30034}
# 内部接口共享令牌：2026-09-11 起 X-Recon-Token 校验已按用户要求整段删除，本键**已无任何读取方**，
recon.internal-token=${RECON_INTERNAL_TOKEN:}
# 分片临时目录，分片一经上送即删除，磁盘峰值只有「并发文件类型数 × 单片上限」
recon.export.temp-dir=${RECON_EXPORT_TEMP_DIR:/home/javaapp/app/recon-export}
# EXP keyset 分页每批行数
recon.export.page-size=${RECON_EXPORT_PAGE_SIZE:5000}
# 抽取线程数，默认 1 即串行，放大只会互相抢 Oracle IO 与 Druid 连接
recon.export.worker=${RECON_EXPORT_WORKER:1}
