# 全部键一律写成 ${ENV_VAR:默认值}：**不注入任何 env 也能起**，注入即覆盖。
# NEVER 写裸硬编码值 —— 那样线上只能靠 Spring relaxed binding 的 env 名去猜（AGENTS.md §8
# 那 7 处 testngbackV2 残留就是这么来的：除 gate-txn-pay 一处外全是裸值，排查时无从下手）。
server.port=${SERVER_PORT:9113}
spring.application.name=${SPRING_APPLICATION_NAME:trans-query-server}

other.web.unSafeUrlChars=${OTHER_WEB_UNSAFEURLCHARS:null}
other.web.enableLogRequestInFilter=${OTHER_WEB_ENABLE_LOG_REQUEST_IN_FILTER:true}
other.web.enableBodyCacheFilter=${OTHER_WEB_ENABLE_BODY_CACHE_FILTER:true}
other.web.enableLogTakeTimesInInterceptor=${OTHER_WEB_ENABLE_LOG_TAKE_TIMES_IN_INTERCEPTOR:true}

knife4j.production=${KNIFE4J_PRODUCTION:false}

# 本服务无数据源：NEVER 加 other.sql.* / mybatis.mapper-locations —— pom 里根本没有 ojdbc 与
# sql-datasource，加了也只会在启动期报「找不到驱动」。要查库一律经 rpc 问持有该表的服务。

# 服务间调用地址：默认值一律用集群内网 Service 名（照抄 ticket-server 已实测回填的值，2026-09-11
# `kubectl get svc -n itp`）。**Service 端口不等于对端 server.port**，NEVER 按 server.port 推断。
# NEVER 删键：键缺失时 rpc 退化成默认服务名 `*-service`、DNS 解析不到。
# 线上真实值以 K8s Deployment env 覆盖为准（env 覆盖 jar 内同名键，改 env 不需要重建镜像）。
service.gateTxnPay.url=${SERVICE_GATE_TXN_PAY_URL:http://gate-txn-pay-server-jomf4-svc.itp.svc:30019}
service.gateTxnPay.openLogger=${SERVICE_GATE_TXN_PAY_OPEN_LOGGER:true}

service.paySign.url=${SERVICE_PAY_SIGN_URL:http://pay-sign-server-hsa9w-svc.itp.svc:8080}
service.paySign.openLogger=${SERVICE_PAY_SIGN_OPEN_LOGGER:true}

service.para.url=${SERVICE_PARA_URL:http://para-server-pufrl-svc.itp.svc:30026}
service.para.openLogger=${SERVICE_PARA_OPEN_LOGGER:true}

# 本批**故意不配** service.ticket.url：支付宝行程尚未迁入本服务（阻塞原因与迁入前提见
# TransQueryServer 的 TODO），现在没有任何读取方。留一个无人读的键只会在排查「调用不通」时
# 把人带偏（AGENTS.md §8「service.*.url 三类问题」）。迁入时 MUST 同批补：这里的键 +
# 启动类的 @EnableRpcTicket。
#
# service.dailyTicket.url 已于 2026-09-15 补齐并且**有真实读取方**：IF8A-34 详情给日票免扣费单
# 填 payTradeOrderNo / payOrderNoDate / payChannelCode 时要调 daily-ticket-server，
# 值与 ticket-server 的同名键保持一致，NEVER 只改一边。
service.dailyTicket.url=${SERVICE_DAILY_TICKET_URL:http://daily-ticket-server-rdbe5-svc.itp.svc:30027}
service.dailyTicket.openLogger=${SERVICE_DAILY_TICKET_OPEN_LOGGER:true}

# 商户号变更配置（IF8A-34 详情在 GATE_TXN_PAY 未落库商户号时才按乘车日期兜底）。
# 与 ticket-server 保持同值，NEVER 只改一边——两边不一致会让同一笔订单在新旧链路返回不同商户号。
# app.trans.merchant-change-date 仍待业务确认（见 docs/ops/生产环境清单.md 已知 P0）。
app.trans.merchant-change-date=${APP_TRANS_MERCHANT_CHANGE_DATE:20260901}
app.trans.old-attributable-party=${APP_TRANS_OLD_ATTRIBUTABLE_PARTY:cjdsj}
app.trans.old-receiving-party=${APP_TRANS_OLD_RECEIVING_PARTY:qddt}
app.trans.new-attributable-party=${APP_TRANS_NEW_ATTRIBUTABLE_PARTY:cjdsj}
app.trans.new-receiving-party=${APP_TRANS_NEW_RECEIVING_PARTY:qddt}
