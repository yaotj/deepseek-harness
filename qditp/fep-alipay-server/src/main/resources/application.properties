server.port=8080
server.tomcat.basedir=./logs
spring.application.name=fep-alipay
other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true
knife4j.production=false

# 服务间调用地址：默认值一律用集群内网 Service 名（`kubectl get svc -n itp` 实测，2026-09-11）。
# NEVER 写 127.0.0.1（等于打到自己），也 NEVER 写 `http://<模块名>:8080` 这种裸名——集群里的 Service 名都带随机后缀，
# 例如支付宝开户是 `alipay-account-server-2n6kc-svc`，裸名 `alipay-account-server` 解析不到。
# 本模块的 `service.account` 指的是**支付宝开户服务**（alipay-account-server），不是 account-server。
service.account.url=${SERVICE_ALIPAY_ACCOUNT_URL:http://alipay-account-server-2n6kc-svc.itp.svc:30021}
service.account.openLogger=true

service.security.url=${SERVICE_SECURITY_URL:http://security-server-8h3eo-svc.itp.svc:8080}
service.security.openLogger=true

service.paySign.url=${SERVICE_PAY_SIGN_URL:http://pay-sign-server-hsa9w-svc.itp.svc:8080}
service.paySign.openLogger=true

service.alipay-pay-sign.url=${SERVICE_ALIPAY_PAY_SIGN_URL:http://alipay-pay-sign-server-t3o7n-svc.itp.svc:30022}
service.alipay-pay-sign.openLogger=true

service.blacklist.url=${SERVICE_BLACKLIST_URL:http://blacklist-server-wmfzs-svc.itp.svc:8080}
service.blacklist.openLogger=true

service.ticket.url=${SERVICE_TICKET_URL:http://ticket-server-bsyju-svc.itp.svc:9100}
service.ticket.openLogger=true

service.industryData.url=${SERVICE_INDUSTRY_DATA_URL:http://industry-data-server-6dv5u-svc.itp.svc:30018}
service.industryData.openLogger=true

service.para.url=${SERVICE_PARA_URL:http://para-server-pufrl-svc.itp.svc:30026}
service.para.openLogger=true

# 支付宝行程查询（findTravelList / findTravelDetail）自 1.0.5 起下沉到 trans-query-server。
# 原来这里配的 service.gateTxnPay.url 已随之删除：GateTxnPayClient 在本模块已零引用，
# 那条链路的 GATE_TXN_PAY 查询现在由 trans-query-server 自己发起。
# **线上真实值以 Deployment env 为准**（2026-09-18 已注入 `service.transQuery.url`，键名带点、不是
# SERVICE_TRANS_QUERY_URL），下面这个默认值只是本地/新环境兜底，NEVER 拿它当线上路由证据。
# 两个易错点：Deployment 与容器名是 trans-query（**不是** trans-query-server）；
# Service trans-query-57wpd-svc 的端口是 30035（**不是** 该模块 server.port 的 9113）。
service.transQuery.url=${SERVICE_TRANS_QUERY_URL:http://trans-query-57wpd-svc.itp.svc:30035}
service.transQuery.openLogger=true

industry.issue-channel-code=07

# 支付宝出行-行程数据推送接口（ITP 主动推送给支付宝的外部接口地址）
alipay.notify.push-trans-data-url=https://openapi.alipay.com/gateway.do

# 支付宝出行-业务关闭结果通知接口（ITP 主动推送给支付宝的外部接口地址）
alipay.notify.close-result-url=https://openapi.alipay.com/gateway.do

# 支付宝出行-行业数据推送接口（ITP 主动推送给支付宝的外部接口地址）
alipay.notify.card-data-url=https://openapi.alipay.com/gateway.do

# 支付宝出行-黑名单状态变更通知接口（ITP 主动推送给支付宝的外部接口地址）
alipay.notify.blacklist-url=https://openapi.alipay.com/gateway.do
