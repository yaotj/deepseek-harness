server.port=9104
spring.application.name=fep-dev
other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true
knife4j.production=false

# traceId 关联（2026-10-14 接入，「三行成组」）：闸机/设备域入口，开启后入向 traceparent/b3 才能续接进 MDC。
# 只需要 MDC 里的 traceId/spanId 供 VictoriaLogs 日志检索，span 上报一律不要。
# NEVER 删第三行排除：Deployment 一旦注入 MANAGEMENT_OTLP_TRACING_ENDPOINT 就会起 OTLP exporter。
management.tracing.enabled=true
management.tracing.sampling.probability=0
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration

# 服务间调用地址：默认值一律用集群内网 Service 名（`kubectl get svc -n itp` 实测，2026-09-11）。
service.key.url=${SERVICE_KEY_URL:http://172.20.211.200:30015}
service.key.openLogger=true

# 原默认值是 127.0.0.1:9097，端口也是错的（ticket 的 Service 端口是 9100，容器 server.port 才是 9103）。
service.ticket.url=${SERVICE_TICKET_URL:http://ticket-server-bsyju-svc.itp.svc:9100}
service.ticket.openLogger=true
