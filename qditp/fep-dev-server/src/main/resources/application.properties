server.port=9104
spring.application.name=fep-dev
other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true
knife4j.production=false

service.account.url=http://127.0.0.1:9098
service.account.openLogger=true

service.security.url=http://127.0.0.1:9012
service.security.openLogger=true

service.ticket.url=http://127.0.0.1:9097
service.ticket.openLogger=true

service.gateTxnPay.url=http://127.0.0.1:9106
service.gateTxnPay.openLogger=true

service.para.url=http://127.0.0.1:9107
service.para.openLogger=true

# 支付宝支付结果回调地址（支付完成后支付宝回调该地址）
pay.center.callback-url=http://fep-alipay-server:8080/api/payment/payNotify

# 支付宝出行扣费参数配置
alipay.trip.scene=TRIP
alipay.trip.payment.vendor=05
alipay.trip.industry.type=1
alipay.trip.subject=地铁乘车扣费
alipay.trip.body=地铁乘车费用
alipay.trip.order.timeout.minutes=60
