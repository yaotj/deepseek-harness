server.port=9104
spring.application.name=fep-dev
other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true
knife4j.production=false

# 服务间调用地址：默认值一律用集群内网 Service 名（`kubectl get svc -n itp` 实测，2026-09-11）。
# NEVER 写 127.0.0.1（在 K8s 里等于打到自己）；**只要对应的 `@EnableRpcXxx` 还在，就 NEVER 删键**
# （键缺失时 rpc 退化成默认服务名 `*-service`、DNS 解析不到）。
# 2026-09-14（ADR-D62）随出站扣费编排迁出，本文件删掉了 `service.account.*` / `service.gateTxnPay.*`
# / `service.para.*` 三组，以及 `pay.center.callback-url` 与整段 `alipay.trip.*` ——
# 那三个 `@EnableRpcXxx` 已从 `FepDevServer` 摘掉、对应 Client bean 不再存在，键留着只会让人
# 误以为本模块还在调账户 / 支付 / 参数域。`alipay.trip.card-issue-code` 已随
# `AlipayIndustryDetailAssembler` 挪到 `ticket-server/application.properties`。
# 2026-09-14（ADR-D67）删掉 `service.security.*` 两行（原值
# `service.security.url=${SERVICE_SECURITY_URL:http://security-server-8h3eo-svc.itp.svc:8080}`
# + `service.security.openLogger=true`，回滚照抄）：全模块 grep `SecurityClient` 零命中，
# `@EnableRpcSecurity` 已同批从 `FepDevServer` 摘掉，该键已无读取方。
# 同批补上 `service.key.url` —— 它此前**在本文件里根本不存在**，而 `KeySyncHandler` 一直在注
# `KeyClient`，靠的是 K8s Deployment 那条 env（实测 `service.key.url=http://172.20.211.200:30015`）。
# 缺键时 `KeyClient` 的 `@Value` 默认值是服务名 `key-service`，集群里没有这个 Service ⇒
# **IF1A-02 密钥同步整条静默哑掉**。下面的默认值即取自那条 env，NEVER 再删。
service.key.url=${SERVICE_KEY_URL:http://172.20.211.200:30015}
service.key.openLogger=true

# 原默认值是 127.0.0.1:9097，端口也是错的（ticket 的 Service 端口是 9100，容器 server.port 才是 9103）。
service.ticket.url=${SERVICE_TICKET_URL:http://ticket-server-bsyju-svc.itp.svc:9100}
service.ticket.openLogger=true
