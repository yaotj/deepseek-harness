server.port=${SERVER_PORT:9112}
spring.application.name=recon-server
spring.threads.virtual.enabled=true

other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=false
other.web.enableBodyCacheFilter=false
other.web.enableLogTakeTimesInInterceptor=false
# 对账内部接口（/internal/recon/**）当前无鉴权，有意临时降级，上线前 MUST 恢复。
other.web.skipCheckTokenUrls=/**

# traceId 三行成组：enabled + sampling.probability=0 + 排除 OtlpAutoConfiguration。
management.tracing.enabled=true
management.tracing.sampling.probability=0
# NEVER 删除下面这行排除（OtlpAutoConfiguration），理由见 docs/business/recon.md 阶段二 §十二。
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration

other.sql.host=${DB_HOST:}
other.sql.double-datasource=false
other.sql.type=oracle
other.sql.page.type=oracle
other.sql.database=${DB_NAME:}
other.sql.username=${DB_USERNAME:}
other.sql.password=${DB_PASSWORD:}

mybatis.mapper-locations=classpath*:mapper/*.xml

recon.storage.root=${RECON_STORAGE_ROOT:/home/javaapp/app/recon}
recon.sources=${RECON_SOURCES:gate-txn-pay,ticket,daily-ticket}
recon.max-part-bytes=${RECON_MAX_PART_BYTES:134217728}
recon.max-part-records=${RECON_MAX_PART_RECORDS:250000}
recon.internal-token=${RECON_INTERNAL_TOKEN:}

# PAY 汇总文件线路段补齐（2026-09-16），详见 docs/business/recon.md §十。
recon.line-backfill.enabled=${RECON_LINE_BACKFILL_ENABLED:true}
recon.line-backfill.file-types=${RECON_LINE_BACKFILL_FILE_TYPES:PAY}
recon.line-backfill.line-field-index=${RECON_LINE_BACKFILL_LINE_INDEX:1}
recon.line-backfill.station-field-index=${RECON_LINE_BACKFILL_STATION_INDEX:2}

recon.ftp.host=${RECON_FTP_HOST:}
recon.ftp.port=${RECON_FTP_PORT:21}
recon.ftp.username=${RECON_FTP_USERNAME:}
recon.ftp.password=${RECON_FTP_PASSWORD:}
# 远端目录 /itp/recon（甲方规格）
recon.ftp.remote-root=${RECON_FTP_REMOTE_ROOT:/itp/recon}
recon.ftp.enabled=${RECON_FTP_ENABLED:false}

recon.orchestration.enabled=${RECON_ORCHESTRATION_ENABLED:true}
# 触发时机由 web-admin sys_job 225 决定（2026-09-21 由 109 改号为 225），本模块无 cron 配置。
recon.orchestration.advance-delay-millis=${RECON_ADVANCE_DELAY_MILLIS:60000}
recon.orchestration.run-timeout-millis=${RECON_RUN_TIMEOUT_MILLIS:240000}
# 甲方规定 T 日 2 点统计 T-2~T-1，文件名后缀取 T-2，故偏移为 2
recon.orchestration.window-offset-days=${RECON_WINDOW_OFFSET_DAYS:2}
# 各文件类型独立账期偏移；DETAIL 按「运营日」口径(需求§一(4))需改为 1，但文件名后缀是否同步为运营日属待甲方确认项，默认不启用。
# recon.orchestration.window-offset-days-by-type.DETAIL=1
recon.orchestration.window-start-time=${RECON_WINDOW_START_TIME:020000}
recon.orchestration.max-retry=${RECON_MAX_RETRY:3}

# 期望清单：三个源，地址 2026-09-11 实测，Service 端口 = NodePort 号。
# 2026-10-13 移除 collect-pay（旧表）源：旧表在 2026-09-18 账期起已落在窗口外、不再有新数据，其 PAY/BUS 由 face-pay 承接。
recon.orchestration.sources[0].name=gate-txn-pay
recon.orchestration.sources[0].url=${RECON_SRC_GATE_TXN_PAY_URL:http://gate-txn-pay-server-jomf4-svc.itp.svc:30019}
recon.orchestration.sources[0].file-types=EXP,PAY,BUS,DETAIL
recon.orchestration.sources[1].name=daily-ticket
recon.orchestration.sources[1].url=${RECON_SRC_DAILY_TICKET_URL:http://daily-ticket-server-rdbe5-svc.itp.svc:30027}
recon.orchestration.sources[1].file-types=PAY,DETAIL
# face-pay（2026-09-16 新增，原第 4 个源；现为 TVM/BOM 域唯一新表源，承接原 collect-pay 的 PAY/BUS）。
recon.orchestration.sources[2].name=face-pay
recon.orchestration.sources[2].url=${RECON_SRC_FACE_PAY_URL:http://face-pay-server-svc.itp.svc:30025}
recon.orchestration.sources[2].file-types=PAY,BUS

# ReconExportClient 的 baseUrl 固定为空串，下发地址取 sources[].url 的绝对 URL。
service.recon.openLogger=${SERVICE_RECON_OPEN_LOGGER:true}

# 把 InternalMicroHttp 的 logger 压到 WARN，NEVER 删除下面这行配置。
logging.level.com.chinasofti.huateng.micro.web.client.InternalMicroHttp=WARN

# ============ 第三方支付对账（TXNDIFF + 渠道账单） ============
# 设计见 docs/business/recon-thirdparty.md；以下为默认关闭，待甲方确认项(§五)逐项拍板后再启用。
recon.thirdparty.enabled=${RECON_THIRDPARTY_ENABLED:false}
# 账单投递方式待确认(§五项1)：当前仅支持本地放置，FTP 拉取为后续扩展点。
recon.thirdparty.bill-local-dir=${RECON_THIRDPARTY_BILL_DIR:/home/javaapp/app/recon/thirdparty-bill}
recon.thirdparty.bill-file-pattern=${RECON_THIRDPARTY_BILL_PATTERN:reconciliation-bill-*.csv}
recon.thirdparty.output-dir=${RECON_THIRDPARTY_OUTPUT_DIR:/home/javaapp/app/recon/txndiff}
# 调度归属待确认(§五项9)：默认关闭 @Scheduled，生产由 web-admin sys_job 调 /internal/recon/thirdparty/run。
recon.thirdparty.scheduler.enabled=${RECON_THIRDPARTY_SCHEDULER_ENABLED:false}
recon.thirdparty.scheduler.cron=${RECON_THIRDPARTY_SCHEDULER_CRON:0 30 3 * * ?}
# 渠道枚举映射待确认(§五项5)：key=payment_channel|payment_vendor，value=ITP PAY_CHANNEL_CODE；缺省原值透传。
# recon.thirdparty.channel-mapping.ALIPAY|03=ALIPAY


