server.port=${SERVER_PORT:9112}
spring.application.name=recon-server
spring.threads.virtual.enabled=true

other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=false
other.web.enableBodyCacheFilter=false
other.web.enableLogTakeTimesInInterceptor=false
# NEVER 把 /internal/recon/** 写进这里。该键名与语义相反：FirstFilter.checkToken() 里
# 只有值等于 /**（web.properties:28 的默认值）才整体跳过 JWT 校验，其余情况列表内的 URL
# 反而是「必须带 Authentication 头的 JWT」才放行。2026-09-11 实测：写成 /internal/recon/**
# 后所有分片上送一律 403 {"msg":"check token error"}。对账内部接口的鉴权靠
# ReconInternalController.checkToken() 的 X-Recon-Token 定长比较，与本键无关。
other.web.skipCheckTokenUrls=/**

# traceId 关联：micro/web 默认 management.tracing.enabled=false，此处为 recon 打开。
# 打开后 web-admin 日终对账定时任务（sys_job 109）发来的 W3C traceparent 才能被续接进 MDC，
# 日志 pattern 的 %X{traceId} 才有值，否则前台按 sys_job_log 的 traceId 检索本模块日志会 0 条
# （2026-09-11 实测：调度日志记着 traceId，recon-server 日志里那一列全空，链路对不起来）。
# 本模块没有自带 log4j2 配置、走公共 log4j2-linux.xml，其 pattern 已含 %X{traceId}，只差这个开关。
# 同一条 traceparent 还会由 Boot 的 WebClient 观测自动带给三个源服务的 /internal/recon/export，
# 因此 gate-txn-pay / collect-pay / daily-ticket 三个源模块 MUST 一起打开本开关，否则链路在源侧断开。
# 只需要 MDC 里的 traceId/spanId 供 VictoriaLogs 日志检索，span 上报一律不要。
management.tracing.enabled=true
management.tracing.sampling.probability=0
# NEVER 删除下面这行排除（口径同 pay-sign-server / card-pool-server）：
# 1) sampling.probability=0 只让本服务发起的 trace 不采样，采样器是 parentBased(traceIdRatioBased(0))，
#    上游带 sampled=1 的 traceparent / b3 头进来时 span 仍会被采样并进导出队列；
# 2) micro/web 的 web.properties 已把 management.otlp.tracing.endpoint 整行注释掉，本行是第二道保险——
#    K8s Deployment 只要注入 MANAGEMENT_OTLP_TRACING_ENDPOINT env 就会重新激活 exporter；
# 3) Boot 3.2.6 没有 management.tracing.export.enabled 这个开关，把 endpoint 置空也不行
#    （OtlpAutoConfiguration 只判断键是否存在），只能排掉整个自动配置。
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration

other.sql.host=${DB_HOST:}
other.sql.double-datasource=false
other.sql.type=oracle
other.sql.page.type=oracle
other.sql.database=${DB_NAME:}
other.sql.username=${DB_USERNAME:}
other.sql.password=${DB_PASSWORD:}

mybatis.mapper-locations=classpath*:mapper/*.xml

recon.storage.root=${RECON_STORAGE_ROOT:/home/javaapp/app/recon}
recon.sources=${RECON_SOURCES:gate-txn-pay,ticket,collect-pay,daily-ticket}
recon.max-part-bytes=${RECON_MAX_PART_BYTES:134217728}
recon.max-part-records=${RECON_MAX_PART_RECORDS:250000}
recon.internal-token=${RECON_INTERNAL_TOKEN:}

# PAY 汇总文件「线路」段的补齐（2026-09-16 起生效）。
# 线路原先由四个源各自 LEFT JOIN STATION_INFO 取，那等于「线路怎么取」这件事有四份副本、
# 四份各自的 join 列名、四次维表结构变更的暴露面；而线路是车站的函数，因此改由本模块在聚合完成、
# 写文件之前按车站码统一补齐，各源只出车站码、不再认识 STATION_INFO。
# 覆盖是无条件的：不判断源上送的线路段是空还是有值，一律按车站码重算。对「还没改、仍自带线路」
# 的源来说覆盖进去的是同一个值、文件逐字节不变，因此四个源与本模块的部署顺序完全自由。
# 出问题时把 enabled 改成 false 即可退回「原样写出源上送的线路段」，不必回滚镜像。
# NEVER 往 file-types 里加 EXP 或 DETAIL：那两类走明细路径、是字节流式拼接、全程不解析行内容，
# 加进去既不生效也不报错。
recon.line-backfill.enabled=${RECON_LINE_BACKFILL_ENABLED:true}
recon.line-backfill.file-types=${RECON_LINE_BACKFILL_FILE_TYPES:PAY}
recon.line-backfill.line-field-index=${RECON_LINE_BACKFILL_LINE_INDEX:1}
recon.line-backfill.station-field-index=${RECON_LINE_BACKFILL_STATION_INDEX:2}

recon.ftp.host=${RECON_FTP_HOST:}
recon.ftp.port=${RECON_FTP_PORT:21}
recon.ftp.username=${RECON_FTP_USERNAME:}
recon.ftp.password=${RECON_FTP_PASSWORD:}
# 远端目录来源：甲方《ACC与ITP之间的文件》一、对账文件 —— ITP 上传至固定路径 /itp/recon/
recon.ftp.remote-root=${RECON_FTP_REMOTE_ROOT:/itp/recon}
recon.ftp.enabled=${RECON_FTP_ENABLED:false}

recon.orchestration.enabled=${RECON_ORCHESTRATION_ENABLED:true}
# 触发时机与频率由 web-admin 的 sys_job（reconQuartzTask.runDailyBatch()）决定，本模块没有 cron 配置。
# 原 recon.orchestration.dispatch-cron 与 env RECON_DISPATCH_CRON 已删除，NEVER 加回。
# 下面两项是「一次整批运行」内部的节奏：轮询间隔与总超时。
recon.orchestration.advance-delay-millis=${RECON_ADVANCE_DELAY_MILLIS:60000}
recon.orchestration.run-timeout-millis=${RECON_RUN_TIMEOUT_MILLIS:240000}
# 甲方规定 T 日 2 点统计 T-2 日 2 点 ~ T-1 日 2 点，文件名后缀取 T-2 日，故偏移为 2
recon.orchestration.window-offset-days=${RECON_WINDOW_OFFSET_DAYS:2}
recon.orchestration.window-start-time=${RECON_WINDOW_START_TIME:020000}
recon.orchestration.max-retry=${RECON_MAX_RETRY:3}

# 期望清单按甲方四类文件排布，2026-09-16 起是四个源（新增 face-pay，见 sources[3] 上方说明）；
# 地址 2026-09-11 实测自 `kubectl get svc -n itp`，
# Service 端口等于 NodePort 号、不等于容器 server.port；线上仍以 Deployment env 覆盖为准。
# ticket-server 的 ReconExportMapper / ReconExportService 代码保留但不在期望清单内：
# 甲方四类文件中没有 ticket 源的位置（过闸笔数与过闸金额由 gate-txn-pay 出，QRCODE_TXN_DETAIL 不参与），
# 如后续甲方需要过闸明细，再把 ticket 源加回本清单即可，勿删源服务代码。
recon.orchestration.sources[0].name=gate-txn-pay
recon.orchestration.sources[0].url=${RECON_SRC_GATE_TXN_PAY_URL:http://gate-txn-pay-server-jomf4-svc.itp.svc:30019}
recon.orchestration.sources[0].file-types=EXP,PAY,BUS,DETAIL
recon.orchestration.sources[1].name=collect-pay
recon.orchestration.sources[1].url=${RECON_SRC_COLLECT_PAY_URL:http://collect-pay-c23ku-svc.itp.svc:30024}
recon.orchestration.sources[1].file-types=PAY,BUS
recon.orchestration.sources[2].name=daily-ticket
recon.orchestration.sources[2].url=${RECON_SRC_DAILY_TICKET_URL:http://daily-ticket-server-rdbe5-svc.itp.svc:30027}
recon.orchestration.sources[2].file-types=PAY,DETAIL
# face-pay 是 2026-09-16 新增的第 4 个源，只出 PAY 与 BUS，口径来自 F2F_ORDER join F2F_PAYMENT。
# 它与 sources[1] 的 collect-pay 是「新表 / 旧表」并列关系、NEVER 二选一：
# 设备与 APP 流量已于 2026-09-15 切到 face-pay（ADR-D85），新单只进 F2F_*；
# 而切流之前的历史单仍在 collect-pay 那四张旧表里，只有那个源导得出来。
# 去掉任何一个都会让对应时间段的账凭空少一截，而对账文件是纯文本、下游读不出异常。
# Service 名与端口是 kubectl get svc -n itp 实测值（Service 端口等于 NodePort 号 30025）；
# 线上仍以 Deployment env RECON_SRC_FACE_PAY_URL 覆盖为准。
recon.orchestration.sources[3].name=face-pay
recon.orchestration.sources[3].url=${RECON_SRC_FACE_PAY_URL:http://face-pay-server-svc.itp.svc:30025}
recon.orchestration.sources[3].file-types=PAY,BUS

# ReconExportClient 的 baseUrl 固定为空串（复用 URLDynamicRouter 的动态路由做法），
# 下发地址一律取 recon.orchestration.sources[].url 的绝对 URL，因此**不需要**自身地址配置项。
# 原 service.recon.self-url 已删除：它只是占位 baseUrl，却让 InternalMicroHttp 的 INFO 日志
# 打出 http://127.0.0.1:9112/http://<源服务>/internal/recon/export 这种双份地址（2026-09-11 实录）。
service.recon.openLogger=${SERVICE_RECON_OPEN_LOGGER:true}

# InternalMicroHttp 会把整个请求头 Map 直接打进 INFO 日志，其中包含内部令牌 X-Recon-Token 的明文。
# 公共构件 resource/micro 不改，改这里把该 logger 压到 WARN，避免令牌落进日志文件与日志采集。
logging.level.com.chinasofti.huateng.micro.web.client.InternalMicroHttp=WARN

