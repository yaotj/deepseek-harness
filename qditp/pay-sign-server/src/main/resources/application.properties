# 日志：使用本模块自带配置（含 VictoriaLogs appender），不走 micro/web 的 log4j2-linux.xml。
# 该键非空会让 CustomLoggingConfiguration 跳过运行期重载，配置只影响 pay-sign。
logging.config=classpath:log4j2-paysign.xml
# VictoriaLogs 推送地址由环境变量 VLOGS_URL 注入（log4j2 读不到 Spring 配置项，只能读 env/sysprop）。
# 未注入时 appender 自动禁用，文件与控制台日志不受影响。

# traceId 关联：micro/web 默认 management.tracing.enabled=false，此处仅为 pay-sign 打开。
# 只需要 MDC 里的 traceId/spanId 供 VictoriaLogs 日志检索，span 上报一律不要。
management.tracing.enabled=true
management.tracing.sampling.probability=0
# NEVER 删除下面这行排除：
# 1) sampling.probability=0 只让本服务发起的 trace 不采样，采样器是 parentBased(traceIdRatioBased(0))，
#    上游带 sampled=1 的 traceparent / b3 头进来时 span 仍会被采样并进导出队列；
# 2) micro/web 的 web.properties 已把 management.otlp.tracing.endpoint 整行注释掉，本行是第二道保险——
#    K8s Deployment 只要注入 MANAGEMENT_OTLP_TRACING_ENDPOINT env 就会重新激活 exporter；
# 3) Boot 3.2.6 没有 management.tracing.export.enabled 这个开关（更高版本才有），
#    把 endpoint 置成空值也不行（OtlpAutoConfiguration 只判断键是否存在），只能排掉整个自动配置。
# 排掉后 Tracer 与 MDC 的 traceId/spanId 照旧（micrometer-tracing-bridge-otel 提供），仅不再创建 SpanExporter。
# 不需要排 ZipkinAutoConfiguration：opentelemetry-exporter-zipkin 在 micro/web 里是 optional，未传递到本模块。
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration

# API doc switch. doc url: IP:PORT/doc.html. Set true in production.
