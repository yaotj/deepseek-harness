# 禁用虚拟线程
spring.threads.virtual.enabled=false
server.port=8080
server.undertow.io-threads=8
server.undertow.worker-threads=200

spring.application.name=acc-security

logging.level.root=info
logging.level.com.chinasofti=debug
logging.file.path=logs/acc-security

other.web.unSafeUrlChars=null
other.web.enableLogRequestInFilter=true
other.web.enableBodyCacheFilter=true
other.web.enableLogTakeTimesInInterceptor=true
management.tracing.enabled=true
management.tracing.sampling.probability=0
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration

knife4j.production=false

security.firstIp=172.20.201.4
security.firstPort=6666
security.secondPort=7002
security.connectOutTime=3000
security.readOutTime=3000
# 加密机连接池目标大小（与下方 socket 线程池解耦；2000QPS 拉码测算值 48，加密机 B 型整机并发上限 800）
security.channelPoolSize=48
# 池内无空闲连接时的最大排队等待毫秒数，超时返回 hsm unavailable；须远小于上游 Feign 超时
security.acquireTimeoutMs=800
# 空闲连接心跳保活（0x00 系统信息指令）：空闲超 60s 发一次，巡检周期 30s
security.heartbeatEnabled=true
security.heartbeatIdleSeconds=60
security.heartbeatPeriodMs=30000
security.index=01
security.publicKey=797BBE15308FC3C6A2AE8EC65337CDD0665DBDFEE3BE0671F42045F93B91C6DB05653512F22817B1E9277375AB0A2D65A752475DC1963E6F71D85E56E3C58161
security.privateKey=224525589868531772E03470B5187F242C4D54994A52EEA2E9F6ACC0DD0043D9

thread.corePoolSize=10
thread.maxPoolSize=10
thread.queueCapacity=99999
thread.socketNamePrefix=socket-connect
itp.signKey=bc4f7c96259acf9946094fa
itp.tacKeyIdex=195
